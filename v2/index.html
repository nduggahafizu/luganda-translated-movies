<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unruly Movies — V2 Preview</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4ade80">

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/card-grid.css">
    <link rel="stylesheet" href="/css/mobile-improvements.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="v2-badge">V2 PREVIEW</div>
    <div class="container">
        <div class="app">
            <div id="shellHeader"></div>

            <div class="app-wrapper">
                <div id="shellAside"></div>

                <!-- Main Content -->
                <div class="app-container flex-fill">
                    <div class="container">
                        <div class="app-content pt-md-3">

                            <!-- HOME FRAGMENT -->
                            <div class="fragment" data-fragment="home" id="fragment-home">

                                <!-- Hero banner carousel -->
                                <div class="hero-banner" id="heroBanner">
                                    <div class="hero-banner-skeleton skeleton"></div>
                                </div>
                                <div class="banner-indicators" id="bannerIndicators"></div>

                                <!-- VJ filter pill row -->
                                <div class="vj-pill-row" id="vjPillRow">
                                    <button class="vj-pill active" data-vj="">All</button>
                                </div>

                                <!-- Category rows -->
                                <div id="homeRows">
                                    <div class="loading-spinner">Loading...</div>
                                </div>

                            </div>

                        </div>
                    </div>
                </div>

                <div id="shellFooter"></div>
            </div>
        </div>
    </div>

    <!-- Scroll to Top -->
    <div class="scroll-up">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script>AppShell.mount('home');</script>
    <script src="/js/main.js"></script>
    <script src="/js/luganda-movies-api.js"></script>
    <script src="/js/series-api.js"></script>
    <script defer src="/js/app-shell.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
