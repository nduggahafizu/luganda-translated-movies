[build]
  publish = "."
  command = "echo 'Static site - no build needed'"
  ignore = "native-app/"

# Exclude native app from publish (contains Firebase config that triggers false positive)
[build.processing]
  skip_processing = false

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDPFQ7pjH_hP8LU-C8FGo6U_QLwQ_G7l4o"

# Clean URLs - serve HTML files without .html extension
[[redirects]]
  from = "/movies"
  to = "/movies.html"
  status = 200

[[redirects]]
  from = "/catalog"
  to = "/catalog.html"
  status = 200

[[redirects]]
  from = "/player"
  to = "/player.html"
  status = 200

[[redirects]]
  from = "/watch/:id"
  to = "/player.html?id=:id"
  status = 200

[[redirects]]
  from = "/series"
  to = "/series.html"
  status = 200

[[redirects]]
  from = "/series-player"
  to = "/series-player.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/subscribe"
  to = "/subscribe.html"
  status = 200

[[redirects]]
  from = "/subscription"
  to = "/subscription.html"
  status = 200

[[redirects]]
  from = "/uganda-tv"
  to = "/uganda-tv.html"
  status = 200

[[redirects]]
  from = "/tv-stations"
  to = "/tv-stations.html"
  status = 200

[[redirects]]
