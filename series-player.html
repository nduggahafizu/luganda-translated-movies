    <style>
        :root {
            --primary-color: #4ade80;
            --background-dark: #0a0a0a;
            --background-light: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #333333;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background-dark);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }
        
        /* Header */
        .series-header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), var(--background-dark));
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .logo {
            height: 35px;
        }
        
        /* Main Layout */
        .series-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Hero Section */
        .series-hero {
            position: relative;
            height: 450px;
            margin: -20px -20px 0 -20px;
            overflow: hidden;
        }

        .embed-fullscreen-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 50;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid rgba(74, 222, 128, 0.65);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        .embed-fullscreen-btn:hover {
            background: rgba(74, 222, 128, 0.18);
            color: var(--primary-color);
        }
        
        .series-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
        }
        
        .series-hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px;
            background: linear-gradient(transparent, var(--background-dark));
        }
        
        .series-hero-content {
            display: flex;
            gap: 30px;
            align-items: flex-end;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .series-poster {
            width: 180px;
            height: 270px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        
        .series-info h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .series-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .series-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .series-rating {
            color: #ffd700 !important;
        }
        
        .series-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .genre-tag {
            background: rgba(74, 222, 128, 0.2);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: capitalize;
        }
        
        .series-overview {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.7;
            max-width: 700px;
        }
        
        /* Video Player Section */
        .player-section {
            background: var(--background-light);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            max-width: 1500px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
        }

        #ad-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: none;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-container:fullscreen,
        .video-container:-webkit-full-screen,
        .video-container:-ms-fullscreen {
            width: 100vw;
            height: 100vh;
            padding-top: 0;
            border-radius: 0;
        }

        .video-container:fullscreen iframe,
        .video-container:-webkit-full-screen iframe,
        .video-container:-ms-fullscreen iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        
        .no-video-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-secondary);
        }
        
        .no-video-message svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        /* Video Loading Overlay */
        .video-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #fff;
        }
        
        .video-loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(74, 222, 128, 0.3);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .video-loading-overlay p {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .now-playing-info {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .now-playing-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .now-playing-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Season Tabs */
        .season-tabs {
            display: flex;
            overflow-x: auto;
            gap: 5px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid var(--border-color);
        }
        
        .season-tab {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .season-tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .season-tab.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #000;
            font-weight: 600;
        }
        
        /* Episodes List */
        .episodes-container {
            padding: 20px;
        }
        
        .episodes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .episodes-header h3 {
            font-size: 18px;
        }
        
        .episode-count {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .episodes-grid {
            display: grid;
            gap: 15px;
        }
        
        .episode-card {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: var(--background-dark);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .episode-card:hover {
            background: rgba(74, 222, 128, 0.05);
            border-color: var(--primary-color);
        }
        
        .episode-card.active {
            background: rgba(74, 222, 128, 0.1);
            border-color: var(--primary-color);
        }
        
        .episode-card.unavailable {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .episode-card.unavailable:hover {
            background: var(--background-dark);
            border-color: transparent;
        }
        
        .episode-thumbnail {
            width: 160px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #333;
        }
        
        .episode-info {
            flex: 1;
        }
        
        .episode-number {
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .episode-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .episode-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .episode-overview {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .episode-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }
        
        .episode-status.translated {
            color: var(--primary-color);
        }
        
        .episode-status.not-translated {
            color: #ff6b6b;
        }
        
        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error State */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .error-state h2 {
            margin-bottom: 10px;
        }
        
        .error-state p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-color);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
        }
        
        /* Cast Section */
        .cast-section {
            margin-top: 30px;
        }
        
        .cast-section h3 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        
        .cast-grid {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .cast-card {
            text-align: center;
            flex-shrink: 0;
        }
        
        .cast-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            background: #333;
        }
        
        .cast-card .name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
        }
        
        .cast-card .character {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .series-container {
                padding: 14px;
            }

            .series-hero {
                height: 350px;
            }

            .player-section {
                border-radius: 14px;
                box-shadow: none;
            }
            
            .series-hero-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .series-poster {
                width: 140px;
                height: 210px;
            }
            
            .series-info h1 {
                font-size: 24px;
            }
            
            .series-meta {
                justify-content: center;
            }
            
            .series-genres {
                justify-content: center;
            }
            
            .episode-card {
                flex-direction: column;
            }
            
            .episode-thumbnail {
                width: 100%;
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="series-header">
        <button class="back-btn" onclick="history.back()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back
        </button>
        <a href="index.html">
            <img src="assets/images/logo-wordmark.png" alt="Unruly Movies" class="logo">
        </a>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading series...</p>
        </div>
    </main>

    <script src="js/config.js?v=20260124"></script>

    <script>
        // API Configuration - always use production API in production
        const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
        const API_BASE_URL = isProduction 
            ? 'https://luganda-translated-movies-production.up.railway.app'
            : ((window.API_CONFIG && window.API_CONFIG.BASE_URL) || 'http://localhost:5000');

        function getAuthToken() {
            return (
                localStorage.getItem('token') ||
                localStorage.getItem('authToken') ||
                sessionStorage.getItem('token') ||
                sessionStorage.getItem('authToken')
            );
        }

        function normalizeBearerToken(token) {
            if (typeof token !== 'string') return '';
            const trimmed = token.trim();
            return trimmed.toLowerCase().startsWith('bearer ')
                ? trimmed.slice(7).trim()
                : trimmed;
        }

        function redirectToLogin() {
            const currentUrl = window.location.href;
            localStorage.setItem('redirectAfterLogin', currentUrl);
            window.location.replace('login.html?redirect=' + encodeURIComponent(currentUrl));
        }

        function isBot() {
            const ua = navigator.userAgent || '';
            return /Googlebot|bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|ia_archiver|AhrefsBot|SemrushBot|MJ12bot|DotBot|Applebot|Twitterbot|LinkedInBot|WhatsApp|Slack|Discordbot/i.test(ua);
        }

        async function requireLoggedInMember() {
            const token = normalizeBearerToken(getAuthToken());
            if (!token) { redirectToLogin(); return false; }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/check-access`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('authToken');
                    redirectToLogin();
                    return false;
                }

                if (!response.ok) return true;

                const data = await response.json();
                if (!data.success) { redirectToLogin(); return false; }

                window._seriesAccess = data.access;

                // Free plan — let the page load, gate at play time
                if (data.access && data.access.freeUser) {
                    return true; // allow loadSeries() so episode list is visible
                }

                return true;
            } catch (error) {
                return true;
            }
        }
        
        // Get series ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const seriesId = urlParams.get('id');
        const requestedSeason = parseInt(urlParams.get('season') || '1', 10);
        const requestedEpisode = parseInt(urlParams.get('episode') || '0', 10);
        
        let seriesData = null;
        let currentSeason = Number.isFinite(requestedSeason) && requestedSeason > 0 ? requestedSeason : 1;
        let currentEpisode = (Number.isFinite(requestedEpisode) && requestedEpisode > 0)
            ? { season: currentSeason, episode: requestedEpisode }
            : null;
        let seriesFullscreenRotation = false;

        function requestVideoContainerFullscreen(event) {
            if (event) event.preventDefault();
            const container = document.querySelector('.video-container');
            if (!container) return;
            const req = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
            if (req) req.call(container);
        }

        function isMobileSeriesViewport() {
            return window.matchMedia('(max-width: 920px)').matches;
        }

        async function lockSeriesLandscape() {
            if (!isMobileSeriesViewport()) return;

            try {
                if (screen.orientation?.lock) {
                    await screen.orientation.lock('landscape');
                    seriesFullscreenRotation = true;
                } else if (screen.lockOrientation) {
                    screen.lockOrientation('landscape');
                    seriesFullscreenRotation = true;
                }
            } catch (error) {
                seriesFullscreenRotation = false;
                console.log('Series orientation lock skipped:', error.message);
            }
        }

        function unlockSeriesLandscape() {
            if (!seriesFullscreenRotation) return;

            try {
                if (screen.orientation?.unlock) {
                    screen.orientation.unlock();
                } else if (screen.unlockOrientation) {
                    screen.unlockOrientation();
                }
            } catch (error) {
                console.log('Series orientation unlock skipped:', error.message);
            }

            seriesFullscreenRotation = false;
        }

        document.addEventListener('fullscreenchange', () => {
            const isFullscreen = Boolean(document.fullscreenElement);
            document.body.classList.toggle('fullscreen-active', isFullscreen);

            if (isFullscreen) {
                lockSeriesLandscape();
            } else {
                unlockSeriesLandscape();
            }
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Bots/crawlers: skip auth gate so Google indexes the content
            if (isBot()) {
                if (seriesId) loadSeries();
                return;
            }
            const isAuthorized = await requireLoggedInMember();
            if (!isAuthorized) return;

            if (!seriesId) {
                showError('No series ID provided');
                return;
            }
            loadSeries();
        });
        
        async function loadSeries() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/series/${seriesId}`);
                const data = await response.json();
                
                if (!data.success || !data.data) {
                    showError('Series not found');
                    return;
                }
                
                seriesData = data.data;
                
                // Update page title
                document.title = `${seriesData.originalTitle} - Unruly Movies`;
                
                renderSeries();
            } catch (error) {
                console.error('Error loading series:', error);
                showError('Failed to load series');
            }
        }
        
        function renderSeries() {
            const container = document.getElementById('main-content');
            
            // Get current season data
            const seasonData = seriesData.seasons?.find(s => s.seasonNumber === currentSeason) || seriesData.seasons?.[0];
            if (seasonData?.seasonNumber && seasonData.seasonNumber !== currentSeason) {
                currentSeason = seasonData.seasonNumber;
                if (currentEpisode) {
                    currentEpisode.season = currentSeason;
                }
            }
            
            // Find first available episode
            if (!currentEpisode && seasonData?.episodes?.length > 0) {
                const availableEpisode = seasonData.episodes.find(ep => ep.video?.embedUrl);
                if (availableEpisode) {
                    currentEpisode = {
                        season: currentSeason,
                        episode: availableEpisode.episodeNumber
                    };
                }
            }
            
            // Get current episode data
            const currentEp = currentEpisode 
                ? seriesData.seasons?.find(s => s.seasonNumber === currentEpisode.season)
                    ?.episodes?.find(e => e.episodeNumber === currentEpisode.episode)
                : null;
            
            container.innerHTML = `
                <!-- Hero Section -->
                <section class="series-hero">
                    <img src="${seriesData.backdrop || seriesData.poster || '/assets/images/placeholder.svg'}" 
                         alt="${seriesData.originalTitle}" class="series-backdrop"
                         onerror="this.src='/assets/images/placeholder.svg'">
                    <div class="series-hero-overlay">
                        <div class="series-hero-content">
                            <img src="${seriesData.poster || '/assets/images/placeholder.svg'}" 
                                 alt="${seriesData.originalTitle}" class="series-poster"
                                 onerror="this.src='/assets/images/placeholder.svg'">
                            <div class="series-info">
                                <h1>${seriesData.lugandaTitle || seriesData.originalTitle}</h1>
                                ${seriesData.lugandaTitle && seriesData.lugandaTitle !== seriesData.originalTitle 
                                    ? `<p style="color: var(--text-secondary); margin-bottom: 10px;">${seriesData.originalTitle}</p>` 
                                    : ''}
                                <div class="series-meta">
                                    <span class="series-rating">⭐ ${(seriesData.rating?.imdb || 0).toFixed(1)}</span>
                                    <span>📅 ${seriesData.year || 'Unknown'}</span>
                                    <span>📺 ${seriesData.totalSeasons || 0} Season${seriesData.totalSeasons !== 1 ? 's' : ''}</span>
                                    <span>🎬 ${seriesData.totalEpisodes || 0} Episodes</span>
                                    ${seriesData.vjName ? `<span>🎙️ VJ ${seriesData.vjName}</span>` : ''}
                                </div>
                                <div class="series-genres">
                                    ${(seriesData.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('')}
                                </div>
                                <p class="series-overview">${seriesData.description || 'No description available.'}</p>
                            </div>
                        </div>
                    </div>

        async function _seriesSelectPlan(plan) {
            const token = localStorage.getItem('token') || localStorage.getItem('authToken') || '';
            if (!token) { window.location.href = 'login.html'; return; }
            const btn = document.querySelector(`[data-series-plan="${plan}"]`);
            if (btn) { btn.disabled = true; btn.textContent = 'Redirecting...'; }
            try {
                const r = await fetch(`${API_BASE_URL}/api/payments/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ plan, paymentMethod: 'pesapal' })
                });
                const d = await r.json();
                if (d.status === 'success' && d.data && d.data.redirectUrl) {
                    window.location.href = d.data.redirectUrl;
                } else {
                    alert(d.message || d.error || 'Payment error. Please try again.');
                    if (btn) { btn.disabled = false; btn.textContent = plan.charAt(0).toUpperCase() + plan.slice(1); }
                }
            } catch (e) {
                alert('Network error. Please try again.');
                if (btn) { btn.disabled = false; }
            }
        }

        function downloadEpisode() {
            const seasonData = seriesData.seasons?.find(s => s.seasonNumber === currentSeason);
            const ep = seasonData?.episodes?.find(e => e.episodeNumber === currentEpisode?.episode);
            const url = ep?.video?.embedUrl || ep?.video?.originalVideoPath;
            if (!url) return;
            const title = `${seriesData.originalTitle || 'Series'} S${currentEpisode.season}E${currentEpisode.episode}`;

            if (isIOS()) {
                showIOSDownloadInstructions(url);
                return;

            const fileName = `${title.replace(/[^a-zA-Z0-9 _-]/g, '').trim()}.mp4`;
            if (url.match(/\.(mp4|mkv|webm|m4v)/i)) {
                const proxyDownload = `${API_BASE_URL}/api/video/stream-proxy?url=${encodeURIComponent(url)}&download=${encodeURIComponent(fileName)}`;
                const link = document.createElement('a');
                link.href = proxyDownload;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();

                showNotificationToast('Download started!');

        const VAST_TAG = 'https://pubads.g.doubleclick.net/gampad/live/ads?iu=/23358450278/video-preroll&description_url=https%3A%2F%2Funrulymovies.com&tfcd=0&npa=0&sz=640x480&min_ad_duration=5000&max_ad_duration=30000&gdfp_req=1&unviewed_position_start=1&output=vast&env=vp&impl=s&correlator=';
        const MID_ROLL_INTERVAL = 30 * 60;
        let nextMidRollTime = MID_ROLL_INTERVAL;
        let midRollBusy = false;

        function setupMidRolls() {
            const video = document.getElementById('series-video');
            if (!video) return;
            nextMidRollTime = MID_ROLL_INTERVAL;
            midRollBusy = false;
            video.addEventListener('timeupdate', () => {
                if (midRollBusy) return;
                if (video.currentTime >= nextMidRollTime) {
                    nextMidRollTime = video.currentTime + MID_ROLL_INTERVAL;
                    trySeriesMidRoll();
                }
            });
        }

        function trySeriesMidRoll() {
            const video = document.getElementById('series-video');
            const adContainer = document.getElementById('ad-container');
            if (!video || !adContainer || typeof google === 'undefined' || !google.ima) {
                midRollBusy = false;
                return;
            }
            midRollBusy = true;

            try {
                const adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, video);
                adDisplayContainer.initialize();
                const adsLoader = new google.ima.AdsLoader(adDisplayContainer);

                const resume = () => { adContainer.style.display = 'none'; midRollBusy = false; video.play(); };

                adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, (e) => {
                    const mgr = e.getAdsManager(video);
                    mgr.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, resume);
                    mgr.addEventListener(google.ima.AdEvent.Type.COMPLETE, resume);
                    mgr.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, resume);
                    try {
                        video.pause();
                        adContainer.style.display = 'block';
                        mgr.init(adContainer.offsetWidth, adContainer.offsetHeight, google.ima.ViewMode.NORMAL);
                        mgr.start();
                    } catch (err) { resume(); }
                }, false);

                adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, () => {
                    midRollBusy = false;
                }, false);

                const req = new google.ima.AdsRequest();
                req.adTagUrl = VAST_TAG;
                req.linearAdSlotWidth = adContainer.offsetWidth;
                req.linearAdSlotHeight = adContainer.offsetHeight;
                adsLoader.requestAds(req);
            } catch (e) {
                midRollBusy = false;
            }
        }

        function playPreRollAd() {
            const video = document.getElementById('series-video');
            const adContainer = document.getElementById('ad-container');
            console.log('🎬 Pre-roll: video=', !!video, 'adContainer=', !!adContainer, 'IMA=', typeof google !== 'undefined' && !!google?.ima);
            if (!video || !adContainer || typeof google === 'undefined' || !google.ima) {
                console.warn('🎬 Pre-roll skipped: missing dependencies');
                return;
            }

            try {
                video.pause();
                adContainer.style.display = 'block';

                const adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, video);
                adDisplayContainer.initialize();

                const adsLoader = new google.ima.AdsLoader(adDisplayContainer);

                adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, (e) => {
                    const adsManager = e.getAdsManager(video);
                    adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, () => {
                        adContainer.style.display = 'none';
                        video.play();
                    });
                    adsManager.addEventListener(google.ima.AdEvent.Type.COMPLETE, () => {
                        adContainer.style.display = 'none';
                        video.play();
                    });
                    adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, () => {
                        adContainer.style.display = 'none';
                        video.play();
                    });
                    try {
                        adsManager.init(adContainer.offsetWidth, adContainer.offsetHeight, google.ima.ViewMode.NORMAL);
                        adsManager.start();
                    } catch (err) {
                        adContainer.style.display = 'none';
                        video.play();
                    }
                }, false);

                adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, () => {
                    adContainer.style.display = 'none';
                    video.play();
                }, false);

                const adsRequest = new google.ima.AdsRequest();
                adsRequest.adTagUrl = VAST_TAG;
                adsRequest.linearAdSlotWidth = adContainer.offsetWidth;
                adsRequest.linearAdSlotHeight = adContainer.offsetHeight;
                adsLoader.requestAds(adsRequest);
            } catch (e) {
                adContainer.style.display = 'none';
                if (video) video.play();
            }
        }

            // Handle back button - go to series page instead of closing
            window.addEventListener('popstate', function(event) {
                window.location.href = '/series.html';
            });
        })();
    </script>
