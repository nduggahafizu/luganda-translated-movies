<!DOCTYPE html>
<html lang="en">
<head>
    <title>Genres — Unruly Movies V2 Preview</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4ade80">

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/card-grid.css">
    <link rel="stylesheet" href="/css/mobile-improvements.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="v2-badge">V2 PREVIEW</div>
    <div class="container">
        <div class="app">
            <div id="shellHeader"></div>

            <div class="app-wrapper">
                <div id="shellAside"></div>

                <!-- Main Content -->
                <div class="app-container flex-fill">
                    <div class="container">
                        <div class="app-content pt-md-3">

                            <div class="fragment" data-fragment="genres">

                                <div class="v2-page-header" id="genresHeader">
                                    <h1>
                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
                                        Genres
                                    </h1>
                                    <p>Browse Luganda translated movies by your favorite category.</p>
                                </div>

                                <!-- Genre Cards -->
                                <div class="genres-grid" id="genresGrid">
                                    <div class="loading-spinner">Loading genres...</div>
                                </div>

                                <!-- Genre Movies (hidden until a genre is selected) -->
                                <div id="genreMoviesSection" style="display:none;">
                                    <div class="v2-page-header" style="display:flex; align-items:flex-start; justify-content:space-between; gap: 16px; flex-wrap: wrap;">
                                        <div>
                                            <h1 id="genreMoviesTitle">Genre Movies</h1>
                                            <p>Top picks in this category, VJ translated.</p>
                                        </div>
                                        <button class="v2-btn v2-btn-outline" id="backToGenresBtn">&larr; All Genres</button>
                                    </div>
                                    <div class="card-grid muno-style" id="genreMoviesGrid">
                                        <div class="loading-spinner">Loading...</div>
                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>
                </div>

                <div id="shellFooter"></div>
            </div>
        </div>
    </div>

    <!-- Scroll to Top -->
    <div class="scroll-up">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script>AppShell.mount('genres');</script>
    <script src="/js/main.js"></script>
    <script src="/js/luganda-movies-api.js"></script>
    <script src="js/cards.js"></script>
    <script defer src="/js/app-shell.js"></script>
    <script src="js/genres.js"></script>
</body>
</html>
