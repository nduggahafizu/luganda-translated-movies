<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>Watch - Unruly Movies</title>
    
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <!-- HLS Support -->
    <script src="https://cdn.jsdelivr.net/npm/@videojs/http-streaming@3.10.0/dist/videojs-http-streaming.min.js"></script>
    
    <!-- Config -->
    <script src="js/config.js"></script>
    
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.5);
            --accent: #7CFC00;
            --accent-hover: #9dff44;
            --danger: #e50914;
            --border: rgba(255,255,255,0.1);
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ========== HEADER ========== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        
        .header.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .logo {
            height: 32px;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .header-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* ========== PLAYER CONTAINER ========== */
        .player-section {
            width: 100%;
            background: #000;
            padding: 0 20px 24px;
        }
        
        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 1500px;
            aspect-ratio: 16 / 9;
            background: #000;
            margin: 72px auto 0;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }
        
        /* ========== VIDEO.JS NETFLIX THEME ========== */
        .video-js {
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
        }

        .video-js video {
            object-fit: contain;
            background: #000;
        }
        
        .video-js .vjs-big-play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        
        .video-js .vjs-big-play-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .video-js .vjs-big-play-button .vjs-icon-placeholder:before {
            font-size: 40px;
            line-height: 80px;
        }
        
        /* Control Bar - Netflix Style */
        .video-js .vjs-control-bar {
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
            min-height: 92px;
            height: auto;
            padding: 10px 20px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            align-content: flex-end;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-js:hover .vjs-control-bar,
        .video-js.vjs-paused .vjs-control-bar,
        .video-js.vjs-user-active .vjs-control-bar {
            opacity: 1;
        }
        
        .video-js .vjs-button > .vjs-icon-placeholder:before {
            font-size: 22px;
            line-height: 40px;
        }
        
        .video-js .vjs-control {
            width: 40px;
            height: 40px;
        }
        
        .video-js .vjs-play-control {
            order: 1;
        }
        
        .video-js .vjs-volume-panel {
            order: 2;
        }
        
        .video-js .vjs-current-time {
            order: 3;
            display: flex;
            padding: 0 6px;
        }
        
        .video-js .vjs-time-divider {
            order: 4;
            display: flex;
            padding: 0;
            min-width: auto;
        }
        
        .video-js .vjs-duration {
            order: 5;
            display: flex;
            padding: 0 6px;
        }
        
        .video-js .vjs-progress-control {
            order: 0;
            flex: 1 0 100%;
            height: 40px;
            position: relative;
            inset: auto;
            width: 100%;
            margin-bottom: 4px;
        }
        
        .video-js .vjs-progress-holder {
            height: 5px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin: 0;
            transition: height 0.15s ease;
        }
        
        .video-js .vjs-progress-control:hover .vjs-progress-holder {
            height: 8px;
        }
        
        .video-js .vjs-play-progress {
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        
        .video-js .vjs-slider-horizontal .vjs-play-progress {
            height: 100%;
        }
        
        .video-js .vjs-play-progress:before {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 1;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.6);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        
        .video-js .vjs-progress-control:hover .vjs-play-progress:before {
            transform: translateY(-50%) scale(1.2);
            opacity: 1;
        }
        
        .video-js .vjs-load-progress {
            background: rgba(255,255,255,0.3);
        }
        
        .video-js .vjs-spacer {
            order: 7;
            flex: 1;
        }
        
        .video-js .vjs-playback-rate {
            order: 8;
        }
        
        .video-js .vjs-picture-in-picture-control {
            order: 9;
        }
        
        .video-js .vjs-fullscreen-control {
            order: 10;
        }
        
        /* Time display */
        .video-js .vjs-time-control {
            font-size: 14px;
            font-weight: 500;
            line-height: 40px;
            padding: 0;
            min-width: auto;
        }
        
        /* Volume */
        .video-js .vjs-volume-panel {
            width: 40px;
            transition: width 0.3s ease;
        }
        
        .video-js .vjs-volume-panel:hover,
        .video-js .vjs-volume-panel.vjs-slider-active {
            width: 120px;
        }
        
        .video-js .vjs-volume-bar {
            background: rgba(255,255,255,0.2);
            height: 4px;
            border-radius: 2px;
        }
        
        .video-js .vjs-volume-level {
            background: var(--accent);
            border-radius: 2px;
        }
        
        /* Playback Rate Menu */
        .video-js .vjs-playback-rate .vjs-playback-rate-value {
            font-size: 14px;
            font-weight: 600;
            line-height: 40px;
        }
        
        .video-js .vjs-menu {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .video-js .vjs-menu-item {
            padding: 10px 20px;
            font-size: 14px;
        }
        
        .video-js .vjs-menu-item:hover,
        .video-js .vjs-menu-item.vjs-selected {
            background: var(--accent);
            color: #000;
        }
        
        /* Loading Spinner */
        .video-js .vjs-loading-spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin: -25px 0 0 -25px;
        }
        
        /* Fullscreen */
        .video-js.vjs-fullscreen {
            width: 100vw !important;
            height: 100vh !important;
        }
        
        .video-js.vjs-fullscreen video {
            object-fit: contain;
        }
        
        .video-js.video-fit video {
            object-fit: contain !important;
        }

        .video-js.video-fill video {
            object-fit: cover !important;
        }
        
        /* ========== LOADING OVERLAY ========== */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(124, 252, 0, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: var(--accent);
            font-size: 14px;
            font-weight: 500;
        }
        
        /* ========== ERROR OVERLAY ========== */
        .error-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 60;
            padding: 20px;
            text-align: center;
        }
        
        .error-overlay.active {
            display: flex;
        }
        
        .error-icon {
            width: 60px;
            height: 60px;
            color: var(--danger);
            margin-bottom: 16px;
        }
        
        .error-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .error-message {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
            max-width: 400px;
        }
        
        .error-btn {
            padding: 12px 24px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .error-btn:hover {
            background: var(--accent-hover);
        }
        
        /* ========== CONTENT SECTION ========== */
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Movie Info Card */
        .movie-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        
        .movie-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .movie-poster {
            width: 120px;
            height: 180px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }
        
        .movie-info {
            flex: 1;
            min-width: 0;
        }
        
        .movie-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        
        .movie-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .meta-badge.quality {
            background: var(--accent);
            color: #000;
        }
        
        .meta-badge.rating {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .movie-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .genre-tag {
            padding: 6px 14px;
            background: rgba(124, 252, 0, 0.1);
            border: 1px solid rgba(124, 252, 0, 0.3);
            border-radius: 20px;
            font-size: 13px;
            color: var(--accent);
        }
        
        /* VJ Info */
        .vj-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        
        .vj-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }
        
        .vj-name {
            font-weight: 600;
            color: var(--accent);
        }
        
        .vj-label {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* Description */
        .movie-description {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 15px;
        }
        
        .movie-description.collapsed {
            display: -webkit-box;
            line-clamp: 3;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .show-more-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            margin-top: 8px;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        
        .action-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .action-btn.primary {
            background: var(--accent);
            color: #000;
        }
        
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }
        
        .action-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        
        .action-btn.secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .action-btn.active {
            background: var(--accent);
            color: #000;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* ========== RELATED MOVIES ========== */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        
        .related-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }
        
        .related-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        
        .related-info {
            padding: 12px;
        }
        
        .related-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .related-meta {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* ========== MOBILE STYLES ========== */
        @media (max-width: 768px) {
            .player-section {
                padding: 0 0 20px;
            }

            .header {
                height: 56px;
                padding: 0 16px;
            }
            
            .back-btn span {
                display: none;
            }
            
            .logo {
                height: 28px;
            }
            
            .player-wrapper {
                margin-top: 56px;
                border-radius: 0;
                box-shadow: none;
            }
            
            .video-js .vjs-big-play-button {
                width: 60px;
                height: 60px;
            }
            
            .video-js .vjs-big-play-button .vjs-icon-placeholder:before {
                font-size: 28px;
                line-height: 60px;
            }
            
            .video-js .vjs-control-bar {
                min-height: 74px;
                padding: 8px 10px 10px;
                gap: 4px;
            }
            
            .video-js .vjs-progress-control {
                width: 100%;
                height: 28px;
                margin-bottom: 0;
            }
            
            .video-js .vjs-progress-holder {
                height: 6px;
            }
            
            .video-js .vjs-play-progress:before {
                width: 16px;
                height: 16px;
                right: -8px;
            }
            
            .video-js .vjs-control {
                width: 36px;
                height: 36px;
            }
            
            .video-js .vjs-button > .vjs-icon-placeholder:before {
                font-size: 18px;
                line-height: 36px;
            }
            
            .video-js .vjs-playback-rate {
                display: none;
            }

            .video-js .vjs-volume-panel,
            .video-js .vjs-picture-in-picture-control,
            .video-js .vjs-duration {
                display: none;
            }
            
            .content {
                padding: 16px;
            }
            
            .movie-card {
                padding: 16px;
            }
            
            .movie-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .movie-poster {
                width: 140px;
                height: 210px;
            }
            
            .movie-meta {
                justify-content: center;
            }
            
            .movie-genres {
                justify-content: center;
            }
            
            .movie-title {
                font-size: 20px;
            }
            
            .action-buttons {
                justify-content: center;
            }
            
            .related-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
        }
        
        /* ========== LANDSCAPE MOBILE ========== */
        @media (max-width: 920px) and (orientation: landscape) {
            .header {
                opacity: 0;
            }
            
            body.fullscreen-active .player-wrapper {
                margin-top: 0;
                height: 100vh;
                aspect-ratio: unset;
                max-width: 100%;
                border-radius: 0;
            }
            
            body.fullscreen-active .content {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header" id="header">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Back</span>
        </a>
        
        <a href="index.html">
            <img src="assets/images/logo-wordmark.png" alt="Unruly Movies" class="logo">
        </a>
        
        <div class="header-actions">
            <button class="header-btn" id="shareBtn" title="Share">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
            </button>
        </div>
    </header>
    
    <!-- Player Section -->
    <section class="player-section">
        <div class="player-wrapper" id="playerWrapper">
            <!-- Video.js Player -->
            <video id="videoPlayer" class="video-js vjs-big-play-centered" playsinline>
            </video>
            
            <!-- Loading Overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div class="loading-text">Loading video...</div>
            </div>
            
            <!-- Error Overlay -->
            <div class="error-overlay" id="errorOverlay">
                <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <div class="error-title">Video Unavailable</div>
                <div class="error-message" id="errorMessage">Sorry, this video cannot be played.</div>
                <button class="error-btn" onclick="location.reload()">Try Again</button>
            </div>
        </div>
    </section>
    
    <!-- Content Section -->
    <div class="content">
        <!-- Movie Card -->
        <div class="movie-card">
            <div class="movie-header">
                <img src="assets/images/placeholder-poster.jpg" alt="" class="movie-poster" id="moviePoster">
                <div class="movie-info">
                    <h1 class="movie-title" id="movieTitle">Loading...</h1>
                    
                    <div class="movie-meta" id="movieMeta">
                        <span class="meta-badge quality" id="movieQuality">HD</span>
                        <span class="meta-badge rating" id="movieRating">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                            <span>8.5</span>
                        </span>
                        <span class="meta-badge" id="movieYear">2024</span>
                        <span class="meta-badge" id="movieDuration">2h 15m</span>
                    </div>
                    
                    <div class="movie-genres" id="movieGenres"></div>
                    
                    <div class="vj-info" id="vjInfo">
                        <img src="assets/images/default-avatar.svg" alt="VJ" class="vj-avatar" id="vjAvatar">
                        <div>
                            <div class="vj-label">Translated by</div>
                            <div class="vj-name" id="vjName">VJ Junior</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <p class="movie-description collapsed" id="movieDescription">Loading description...</p>
            <button class="show-more-btn" id="showMoreBtn">Show more</button>
            
            <div class="action-buttons">
                <button class="action-btn primary" id="watchlistBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Add to Watchlist
                </button>
                <button class="action-btn secondary" id="likeBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
                    </svg>
                    Like
                </button>
                <button class="action-btn secondary" id="downloadBtn" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download
                </button>
            </div>
        </div>
        
        <!-- Related Movies -->
        <div id="relatedSection">
            <h2 class="section-title">More Like This</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </div>
    </div>
    
    <script>
        // ========== CONFIGURATION ==========
        const API_BASE = typeof API_CONFIG !== 'undefined' 
            ? API_CONFIG.BASE_URL 
            : 'https://luganda-translated-movies-production.up.railway.app';
        
        // URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');
        
        // DOM Elements
        const videoElement = document.getElementById('videoPlayer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorMessage = document.getElementById('errorMessage');
        const header = document.getElementById('header');
        
        // Video.js Player Instance
        let player = null;
        let currentMovie = null;
        let fullscreenRotateApplied = false;

        function getAuthToken() {
            return localStorage.getItem('token') || sessionStorage.getItem('token');
        }

        function redirectToLogin() {
            const currentUrl = window.location.href;
            localStorage.setItem('redirectAfterLogin', currentUrl);
            window.location.replace(`login.html?redirect=${encodeURIComponent(currentUrl)}`);
        }

        async function requireLoggedInMember() {
            const token = getAuthToken();
            if (!token) {
                showError('Please login or sign up to watch videos. Redirecting...');
                setTimeout(redirectToLogin, 700);
                return false;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    sessionStorage.removeItem('token');
                    showError('Your session expired. Please login again. Redirecting...');
                    setTimeout(redirectToLogin, 700);
                    return false;
                }

                if (!response.ok) {
                    showError('Could not verify your login right now. Please try again.');
                    return false;
                }

                const data = await response.json();
                if (!data.success) {
                    showError('Could not verify your login right now. Please try again.');
                    return false;
                }

                return true;
            } catch (error) {
                showError('Network issue while checking login. Please retry.');
                return false;
            }
        }
        
        // ========== INITIALIZE VIDEO.JS ==========
        function initPlayer() {
            player = videojs('videoPlayer', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: false,
                responsive: true,
                playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
                controlBar: {
                    children: [
                        'playToggle',
                        'volumePanel',
                        'currentTimeDisplay',
                        'timeDivider',
                        'durationDisplay',
                        'progressControl',
                        'customControlSpacer',
                        'playbackRateMenuButton',
                        'pictureInPictureToggle',
                        'fullscreenToggle'
                    ]
                },
                userActions: {
                    hotkeys: true
                }
            });
            
            // Enforce normal playback speed on load
            player.ready(() => {
                try {
                    player.playbackRate(1.0);
                    console.log('⚙️ Playback rate enforced:', player.playbackRate());
                } catch (e) {
                    console.warn('⚠️ Could not enforce playbackRate:', e);
                }
            });

            // Custom event handlers
            player.on('ratechange', () => {
                if (player.playbackRate() !== 1.0) {
                    console.warn('⚠️ Playback rate changed to', player.playbackRate(), '- resetting to 1.0');
                    player.playbackRate(1.0);
                }
            });

            player.on('play', () => {
                hideLoading();
                hideError();
            });
            
            player.on('waiting', () => {
                // Show loading spinner during buffering
            });
            
            player.on('error', (e) => {
                console.error('Video error:', player.error());
                handleVideoError();
            });
            
            // Auto-hide header during playback
            player.on('playing', () => {
                startHeaderHideTimer();
                hideError();
            });
            
            player.on('pause', () => {
                showHeader();
            });
            
            player.on('fullscreenchange', async () => {
                const isFullscreen = player.isFullscreen();
                document.body.classList.toggle('fullscreen-active', isFullscreen);

                if (isFullscreen) {
                    await lockMobileOrientation();
                } else {
                    unlockMobileOrientation();
                }

                syncPlayerLayout();
            });
            
            // Fit/Fill toggle with Z key
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                if (e.key === 'z' || e.key === 'Z') {
                    toggleVideoFit();
                }
            });
            
            return player;
        }

        function isMobileViewport() {
            return window.matchMedia('(max-width: 920px)').matches;
        }

        function isTouchDevice() {
            return window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        }

        async function lockMobileOrientation() {
            if (!isMobileViewport() || !isTouchDevice()) return;

            try {
                if (screen.orientation?.lock) {
                    await screen.orientation.lock('landscape');
                    fullscreenRotateApplied = true;
                } else if (screen.lockOrientation) {
                    screen.lockOrientation('landscape');
                    fullscreenRotateApplied = true;
                } else if (screen.mozLockOrientation) {
                    screen.mozLockOrientation('landscape');
                    fullscreenRotateApplied = true;
                } else if (screen.msLockOrientation) {
                    screen.msLockOrientation('landscape');
                    fullscreenRotateApplied = true;
                }
            } catch (error) {
                fullscreenRotateApplied = false;
                console.log('Orientation lock skipped:', error.message);
            }
        }

        function unlockMobileOrientation() {
            if (!fullscreenRotateApplied) return;

            try {
                if (screen.orientation?.unlock) {
                    screen.orientation.unlock();
                } else if (screen.unlockOrientation) {
                    screen.unlockOrientation();
                } else if (screen.mozUnlockOrientation) {
                    screen.mozUnlockOrientation();
                } else if (screen.msUnlockOrientation) {
                    screen.msUnlockOrientation();
                }
            } catch (error) {
                console.log('Orientation unlock skipped:', error.message);
            }

            fullscreenRotateApplied = false;
        }

        function syncPlayerLayout() {
            if (!player) return;

            const applyResize = () => {
                try {
                    player.trigger('componentresize');
                } catch (error) {
                    console.log('Player resize skipped:', error.message);
                }
            };

            requestAnimationFrame(applyResize);
            setTimeout(applyResize, 250);
        }
        
        // ========== VIDEO FIT/FILL TOGGLE ==========
        let isVideoFit = localStorage.getItem('unruly_video_fit') !== 'false';
        
        function toggleVideoFit() {
            isVideoFit = !isVideoFit;
            localStorage.setItem('unruly_video_fit', isVideoFit ? 'true' : 'false');
            
            const vjsEl = document.querySelector('.video-js');
            if (vjsEl) {
                if (isVideoFit) {
                    vjsEl.classList.add('video-fit');
                    vjsEl.classList.remove('video-fill');
                    showNotification('Video: Fit mode');
                } else {
                    vjsEl.classList.remove('video-fit');
                    vjsEl.classList.add('video-fill');
                    showNotification('Video: Fill mode');
                }
            }
        }
        
        function applyVideoFit() {
            const vjsEl = document.querySelector('.video-js');
            if (!vjsEl) return;

            if (isVideoFit) {
                vjsEl.classList.add('video-fit');
                vjsEl.classList.remove('video-fill');
            } else {
                vjsEl.classList.remove('video-fit');
                vjsEl.classList.add('video-fill');
            }
        }
        
        // ========== HEADER AUTO-HIDE ==========
        let headerTimeout = null;
        
        function startHeaderHideTimer() {
            clearTimeout(headerTimeout);
            headerTimeout = setTimeout(() => {
                if (player && !player.paused()) {
                    header.classList.add('hidden');
                }
            }, 3000);
        }
        
        function showHeader() {
            clearTimeout(headerTimeout);
            header.classList.remove('hidden');
        }
        
        document.addEventListener('mousemove', () => {
            showHeader();
            if (player && !player.paused()) {
                startHeaderHideTimer();
            }
        });

        document.addEventListener('touchstart', () => {
            showHeader();
            if (player && !player.paused()) {
                startHeaderHideTimer();
            }
        }, { passive: true });

        document.addEventListener('keydown', () => {
            showHeader();
            if (player && !player.paused()) {
                startHeaderHideTimer();
            }
        });

        window.addEventListener('resize', syncPlayerLayout);
        window.addEventListener('orientationchange', syncPlayerLayout);
        
        // ========== LOAD VIDEO SOURCE ==========
        function loadVideo(url) {
            if (!url) {
                showError('No video URL provided');
                return;
            }
            
            // Clear any previous error state
            hideError();
            
            // Fix mixed content - convert http to https for known CDNs
            if (url.startsWith('http://')) {
                const httpsUrl = url.replace('http://', 'https://');
                console.log('🔒 Converting to HTTPS:', httpsUrl);
                url = httpsUrl;
            }
            
            // Decode URL-encoded characters (like %20 for spaces)
            try {
                url = decodeURIComponent(url);
                console.log('🔓 Decoded URL:', url);
            } catch (e) {
                console.warn('URL decode failed:', e);
            }
            
            console.log('🎬 Loading video:', url);
            
            // Determine video type
            let type = 'video/mp4';
            const urlLower = url.toLowerCase();
            
            // Handle MKV - use stream-proxy endpoint (remux crashes on server)
            if (urlLower.includes('.mkv')) {
                console.log('🎬 MKV detected - using stream proxy');
                url = `${API_BASE}/api/video/stream-proxy?url=${encodeURIComponent(url)}`;
                type = 'video/mp4';
            }
            // Handle HLS
            else if (urlLower.includes('.m3u8')) {
                type = 'application/x-mpegURL';
            }
            // Handle WebM
            else if (urlLower.includes('.webm')) {
                type = 'video/webm';
            }
            
            // Set source
            console.log('🎬 Setting player source:', { src: url, type: type });
            player.pause();
            player.currentTime(0);
            player.src({ src: url, type: type });
            player.load();

            // Apply fit mode preference
            applyVideoFit();

            // Verify source selection
            setTimeout(() => {
                const currentSrc = player.currentSrc();
                console.log('🎬 Player current source:', currentSrc);
                if (!currentSrc || currentSrc === '') {
                    console.error('❌ Player source not set correctly');
                    showError('Failed to load video source');
                }
            }, 100);

            // Turn on additional error tracking
            player.one('error', () => {
                const err = player.error();
                console.error('⚠️ Player error event:', err);

                if (err && err.code === 4) {
                    // Retry with stream proxy for CODE:4
                    console.warn('⚠️ Retrying playback for CODE:4 with stream proxy');
                    const proxyUrl = `${API_BASE}/api/video/stream-proxy?url=${encodeURIComponent(url)}`;
                    
                    player.src({ src: proxyUrl, type: type });
                    player.load();
                    player.play().catch(playErr => {
                        console.error('Proxy play failed:', playErr);
                        showError('Video not supported. Try refreshing the page.');
                    });
                }
            });

            // Attempt to play
            player.ready(() => {
                hideLoading();
                hideError();
                player.play().catch(e => {
                    console.log('Autoplay blocked:', e);
                    hideLoading();
                });
            });
        }
        
        // ========== LOAD MOVIE DATA ==========
        async function loadMovieData() {
            if (!movieId) {
                showError('No movie ID provided');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/luganda-movies/${movieId}`);
                const data = await response.json();
                
                if ((data.status === 'success' || data.success) && data.data) {
                    currentMovie = data.data;
                    
                    // Redirect series to series player
                    if (currentMovie.contentType === 'series' || (currentMovie.seasons && currentMovie.seasons.length > 0)) {
                        window.location.replace(`series-player.html?id=${movieId}`);
                        return;
                    }
                    
                    // Update UI
                    updateMovieInfo(currentMovie);
                    
                    // Get video URL
                    const rawVideoUrl = currentMovie.video?.embedUrl || currentMovie.embedUrl || currentMovie.video?.url;
                    const videoUrl = typeof rawVideoUrl === 'string' ? rawVideoUrl.trim() : rawVideoUrl;
                    const provider = (currentMovie.video?.provider || '').toLowerCase();
                    const format = (currentMovie.video?.format || '').toLowerCase();
                    
                    if (videoUrl && (isDirectVideo(videoUrl) || format === 'mp4' || format === 'm3u8' || format === 'webm')) {
                        loadVideo(videoUrl);
                    } else if (videoUrl && provider !== 'streamtape') {
                        await loadEmbedVideo(videoUrl);
                    } else if (videoUrl) {
                        loadVideo(videoUrl);
                    } else {
                        showError('Video not available for this movie');
                    }
                    
                    // Load related movies
                    loadRelatedMovies();
                    
                } else {
                    showError('Movie not found');
                }
            } catch (error) {
                console.error('Error loading movie:', error);
                showError('Failed to load movie');
            }
        }
        
        // ========== CHECK IF DIRECT VIDEO URL ==========
        function isDirectVideo(url) {
            const extensions = ['.mp4', '.webm', '.mkv', '.m3u8', '.m4v'];
            const normalizedUrl = typeof url === 'string' ? url.trim() : '';
            const urlLower = normalizedUrl.toLowerCase();
            return extensions.some(ext => urlLower.includes(ext)) ||
                   urlLower.includes('archive.org') ||
                   urlLower.includes('cloudflare') ||
                   urlLower.includes('r2.dev') ||
                   urlLower.includes('b-cdn.net') ||
                   urlLower.includes('bunnycdn') ||
                   urlLower.includes('pearlpix.xyz') ||
                   urlLower.includes('munotech.b-cdn.net') ||
                   urlLower.includes('jimmy.pearlpix.xyz');
        }
        
        // ========== LOAD EMBED VIDEO ==========
        async function loadEmbedVideo(url) {
            console.log('🎬 Attempting to extract direct URL from:', url);
            
            try {
                const response = await fetch(`${API_BASE}/api/video/extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (data.success && data.directUrl) {
                    console.log('✅ Direct URL extracted');
                    loadVideo(data.directUrl);
                    return;
                }
            } catch (e) {
                console.warn('Extraction failed:', e);
            }
            
            // Fallback to iframe
            showError('This video requires an external player. Opening in new tab...');
            setTimeout(() => {
                window.open(url, '_blank');
            }, 2000);
        }
        
        // ========== UPDATE MOVIE INFO ==========
        function updateMovieInfo(movie) {
            document.title = `${movie.originalTitle || movie.title} - Unruly Movies`;
            
            document.getElementById('movieTitle').textContent = movie.originalTitle || movie.title;
            document.getElementById('movieDescription').textContent = movie.plot || movie.description || 'No description available.';
            
            const poster = document.getElementById('moviePoster');
            poster.src = movie.poster || 'assets/images/placeholder-poster.jpg';
            poster.alt = movie.originalTitle || movie.title;
            
            // Meta info
            if (movie.quality) {
                document.getElementById('movieQuality').textContent = movie.quality;
            }
            
            if (movie.rating || movie.imdbRating) {
                document.getElementById('movieRating').innerHTML = `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    <span>${movie.rating || movie.imdbRating}</span>
                `;
            }
            
            if (movie.year || movie.releaseYear) {
                document.getElementById('movieYear').textContent = movie.year || movie.releaseYear;
            }
            
            if (movie.duration || movie.runtime) {
                const mins = parseInt(movie.duration || movie.runtime);
                const hours = Math.floor(mins / 60);
                const remaining = mins % 60;
                document.getElementById('movieDuration').textContent = hours ? `${hours}h ${remaining}m` : `${mins}m`;
            }
            
            // Genres
            const genresContainer = document.getElementById('movieGenres');
            if (movie.genres && movie.genres.length > 0) {
                genresContainer.innerHTML = movie.genres.map(g => 
                    `<span class="genre-tag">${g}</span>`
                ).join('');
            }
            
            // VJ Info
            if (movie.vjName) {
                document.getElementById('vjName').textContent = `VJ ${movie.vjName}`;
            }
            if (movie.vjAvatar) {
                document.getElementById('vjAvatar').src = movie.vjAvatar;
            }
            
            // Check download permission
            checkDownloadPermission(movie);
        }
        
        // ========== DOWNLOAD PERMISSION ==========
        async function checkDownloadPermission(movie) {
            if (!movie.allowDownload) return;
            
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success && data.data?.canDownload) {
                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.style.display = 'inline-flex';
                    downloadBtn.onclick = () => handleDownload(movie);
                }
            } catch (e) {
                console.log('Could not verify download permission');
            }
        }
        
        function handleDownload(movie) {
            const videoUrl = movie.video?.embedUrl || movie.embedUrl;
            if (!videoUrl) return;
            
            const fileName = `${movie.title || movie.originalTitle || 'movie'}.mp4`;
            
            if (videoUrl.includes('.mp4') || videoUrl.includes('.mkv') || videoUrl.includes('.webm')) {
                const link = document.createElement('a');
                link.href = videoUrl;
                link.download = fileName;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification('Download started!');
            } else {
                window.open(videoUrl, '_blank');
                showNotification('Opening video source');
            }
        }
        
        // ========== RELATED MOVIES ==========
        async function loadRelatedMovies() {
            if (!currentMovie) return;
            
            try {
                const genre = currentMovie.genres?.[0];
                const vjName = currentMovie.vjName;
                
                let url = `${API_BASE}/api/luganda-movies/latest?limit=8`;
                if (genre) {
                    url = `${API_BASE}/api/luganda-movies/genre/${encodeURIComponent(genre)}?limit=8`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status === 'success' && data.data) {
                    const movies = data.data.filter(m => m._id !== currentMovie._id).slice(0, 6);
                    renderRelatedMovies(movies);
                }
            } catch (e) {
                console.log('Could not load related movies');
            }
        }
        
        function renderRelatedMovies(movies) {
            const grid = document.getElementById('relatedGrid');
            grid.innerHTML = movies.map(movie => `
                <a href="player.html?id=${movie._id}" class="related-card">
                    <img src="${movie.poster || 'assets/images/placeholder-poster.jpg'}" alt="${movie.originalTitle || movie.title}" class="related-poster" loading="lazy">
                    <div class="related-info">
                        <div class="related-title">${movie.originalTitle || movie.title}</div>
                        <div class="related-meta">${movie.year || movie.releaseYear || ''} • ${movie.vjName || ''}</div>
                    </div>
                </a>
            `).join('');
        }
        
        // ========== UI HELPERS ==========
        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }
        
        function showError(message) {
            hideLoading();
            errorMessage.textContent = message;
            errorOverlay.classList.add('active');
        }
        
        function hideError() {
            errorOverlay.classList.remove('active');
        }
        
        function handleVideoError() {
            const error = player.error();
            let message = 'Video playback error. Please try again.';
            
            if (error) {
                switch (error.code) {
                    case 1:
                        message = 'Video loading was aborted.';
                        break;
                    case 2:
                        message = 'Network error while loading video.';
                        break;
                    case 3:
                        message = 'Video format not supported.';
                        break;
                    case 4:
                        message = 'Video not found or access denied.';
                        break;
                }
            }
            
            showError(message);
        }
        
        function showNotification(message) {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.9);
                color: #fff;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 10000;
                animation: fadeIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }
        
        // ========== DESCRIPTION TOGGLE ==========
        document.getElementById('showMoreBtn').addEventListener('click', function() {
            const desc = document.getElementById('movieDescription');
            const isCollapsed = desc.classList.contains('collapsed');
            
            if (isCollapsed) {
                desc.classList.remove('collapsed');
                this.textContent = 'Show less';
            } else {
                desc.classList.add('collapsed');
                this.textContent = 'Show more';
            }
        });
        
        // ========== SHARE BUTTON ==========
        document.getElementById('shareBtn').addEventListener('click', async () => {
            const shareData = {
                title: document.getElementById('movieTitle').textContent,
                url: window.location.href
            };
            
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (e) {
                    copyToClipboard(window.location.href);
                }
            } else {
                copyToClipboard(window.location.href);
            }
        });
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Link copied to clipboard!');
            });
        }
        
        // ========== WATCHLIST BUTTON ==========
        let isInWatchlist = false;
        let isLiked = false;
        const watchlistBtn = document.getElementById('watchlistBtn');
        const likeBtn = document.getElementById('likeBtn');

        function getWatchlistButtonContent(active) {
            return active
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><polyline points="9 11 12 14 16 10"></polyline></svg><span>In Watchlist</span>`
                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg><span>Add to Watchlist</span>`;
        }

        function updateLikeButton() {
            likeBtn.classList.toggle('active', isLiked);
            likeBtn.innerHTML = isLiked
                ? `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg><span>Liked</span>`
                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg><span>Like</span>`;
        }
        
        // Check watchlist status on load
        async function checkWatchlistStatus() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token || !movieId) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/playlist/watchlist/check/${movieId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.status === 'success' && data.data.inWatchlist) {
                    isInWatchlist = true;
                    updateWatchlistButton();
                }
            } catch (e) {
                console.log('Could not check watchlist status');
            }
        }
        
        function updateWatchlistButton() {
            watchlistBtn.innerHTML = getWatchlistButtonContent(isInWatchlist);
            watchlistBtn.classList.toggle('active', isInWatchlist);
        }
        
        watchlistBtn.addEventListener('click', async () => {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) {
                showNotification('Please login to add to watchlist');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/playlist/watchlist/toggle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        contentId: movieId,
                        contentType: 'LugandaMovie'
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    isInWatchlist = data.added;
                    updateWatchlistButton();
                    showNotification(data.added ? 'Added to watchlist!' : 'Removed from watchlist');
                }
            } catch (e) {
                showNotification('Could not update watchlist');
            }
        });
        
        // Check watchlist status
        checkWatchlistStatus();
        
        // ========== LIKE BUTTON ==========
        document.getElementById('likeBtn').addEventListener('click', async () => {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) {
                showNotification('Please login to like');
                return;
            }

            likeBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/api/luganda-movies/${movieId}/like`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                if (data.success) {
                    isLiked = true;
                    updateLikeButton();
                    showNotification('Liked!');
                }
            } catch (e) {
                showNotification('Could not like movie');
            } finally {
                likeBtn.disabled = false;
            }
        });
        
        // ========== INITIALIZE ==========
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthorized = await requireLoggedInMember();
            if (!isAuthorized) return;

            initPlayer();
            updateWatchlistButton();
            updateLikeButton();
            loadMovieData();
        });
        
        // Failsafe: Hide loading after 15 seconds
        setTimeout(() => {
            if (!loadingOverlay.classList.contains('hidden')) {
                hideLoading();
            }
        }, 15000);
    </script>
</body>
</html>
