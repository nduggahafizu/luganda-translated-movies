<!DOCTYPE html>
<html lang="en">
<head>
    <title>Watch Uganda TV Live - Unruly Movies</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4ade80">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Video.js -->
    <link href="/vendor/video-js/video-js.css" rel="stylesheet">
    <script src="/vendor/video-js/video.min.js"></script>
    <script src="/vendor/video-js/videojs-http-streaming.min.js"></script>

    <script src="js/config.js"></script>

    <style>
        :root {
            --primary-color: #4ade80;
            --background-dark: #0a0a0f;
            --background-light: #16161f;
            --text-primary: #ffffff;
            --text-secondary: #8b8b99;
            --border-color: #24243a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .tv-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        .tv-back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .tv-back-btn:hover { background: rgba(255,255,255,0.08); }
        .tv-header-logo { height: 28px; }

        .tv-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 0;
            max-width: 1600px;
            margin: 0 auto;
        }

        .tv-main { padding: 20px; }

        .player-shell {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .player-shell .video-js { width: 100%; aspect-ratio: 16/9; }

        .live-indicator {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            padding: 6px 12px 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .live-dot-small {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ff4444;
            animation: livePulse2 1.6s infinite;
        }
        @keyframes livePulse2 {
            0% { box-shadow: 0 0 0 0 rgba(255,68,68,0.6); }
            70% { box-shadow: 0 0 0 8px rgba(255,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,68,68,0); }
        }

        .station-info-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
            padding: 16px 18px;
            background: var(--background-light);
            border: 1px solid var(--border-color);
            border-radius: 14px;
        }
        .station-logo-img {
            width: 52px; height: 52px;
            border-radius: 10px;
            object-fit: contain;
            background: #fff;
            padding: 4px;
            flex-shrink: 0;
        }
        .station-info-bar h1 { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
        .station-info-bar p { font-size: 13px; color: var(--text-secondary); }

        .player-error-state {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(10,10,15,0.96);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 30px;
        }
        .player-error-state.visible { display: flex; }
        .player-error-state svg { margin-bottom: 14px; color: #ff4444; }
        .player-error-state h3 { font-size: 17px; margin-bottom: 8px; }
        .player-error-state p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; max-width: 320px; }
        .retry-btn {
            background: var(--primary-color);
            color: #06240f;
            border: none;
            padding: 10px 24px;
            border-radius: 24px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        /* Channel sidebar */
        .channel-sidebar {
            background: var(--background-light);
            border-left: 1px solid var(--border-color);
            padding: 20px 16px;
            max-height: 100vh;
            overflow-y: auto;
            position: sticky;
            top: 0;
        }
        .channel-sidebar h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            padding: 0 6px;
        }
        .channel-list { display: flex; flex-direction: column; gap: 6px; }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .channel-item:hover { background: rgba(255,255,255,0.04); }
        .channel-item.active {
            background: rgba(74, 222, 128, 0.1);
            border-color: rgba(74, 222, 128, 0.3);
        }
        .channel-item img {
            width: 38px; height: 38px;
            border-radius: 8px;
            object-fit: contain;
            background: #fff;
            padding: 3px;
            flex-shrink: 0;
        }
        .channel-item-name { font-size: 13px; font-weight: 600; flex: 1; }
        .channel-item .live-dot-small { flex-shrink: 0; }

        @media (max-width: 900px) {
            .tv-layout { grid-template-columns: 1fr; }
            .channel-sidebar {
                position: static;
                max-height: none;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }
            .channel-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="tv-header">
        <button class="tv-back-btn" onclick="window.location.href='uganda-tv.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            All Channels
        </button>
        <a href="index.html"><img src="assets/images/logo-wordmark.png" alt="Unruly Movies" class="tv-header-logo"></a>
    </div>

    <div class="tv-layout">
        <div class="tv-main">
            <div class="player-shell" id="playerShell">
                <div class="live-indicator"><span class="live-dot-small"></span> LIVE</div>
                <video id="tvVideoPlayer" class="video-js vjs-big-play-centered" playsinline oncontextmenu="return false"></video>
                <div class="player-error-state" id="playerError">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <h3>Stream Unavailable</h3>
                    <p>This channel's live stream couldn't be loaded. It may be temporarily down — try another channel or retry.</p>
                    <button class="retry-btn" onclick="retryStream()">Retry</button>
                </div>
            </div>

            <div class="station-info-bar">
                <img id="stationLogo" class="station-logo-img" src="" alt="">
                <div>
                    <h1 id="stationName">Loading channel...</h1>
                    <p>Live free-to-air stream — part of Unruly Movies' Uganda TV lineup</p>
                </div>
            </div>
        </div>

        <div class="channel-sidebar">
            <h2>All Channels</h2>
            <div class="channel-list" id="channelList"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/uganda-tv-api.js"></script>
    <script>
        const API_BASE = (typeof API_CONFIG !== 'undefined' ? API_CONFIG.BASE_URL : 'http://localhost:5000');
        let tvPlayer = null;
        let currentStationId = null;

        const STATION_NAMES = {
            'salt-tv': 'Salt TV', 'bukedde-tv': 'Bukedde TV 1', 'bukedde-tv-2': 'Bukedde TV 2',
            'dream-tv': 'Dream TV', 'urban-tv': 'Urban TV', 'ntv-uganda': 'NTV Uganda',
            'nbs-tv': 'NBS TV', 'ubc-tv': 'UBC TV', 'spark-tv': 'Spark TV',
            'sanyuka-tv': 'Sanyuka TV', 'record-tv': 'Record TV', 'pearl-magic': 'Pearl Magic',
            'top-tv': 'Top TV', 'bbs-tv': 'BBS Terefayina', 'tv-west': 'TV West',
            'kingdom-tv': 'Kingdom TV', 'galaxy-tv': 'Galaxy TV', 'jikonkone': 'Jikonkone',
            'tv-east': 'TV East', 'tv-north': 'TV North', 'wan-luo-tv': 'Wan Luo TV',
            'ankole-tv': 'Ankole TV', 'magic-tv': 'Magic TV', '3abn': '3ABN',
            '3abn-kids': '3ABN Kids', 'abn-africa': 'ABN Africa', 'filmbox-family': 'FilmBox Family',
            '4music': '4Music', 'al-jazeera': 'Al Jazeera', 'cnn': 'CNN',
            'bbc-news': 'BBC News', 'france-24': 'France 24'
        };

        function getLogo(stationId) {
            return (window.TV_API_CONFIG && TV_API_CONFIG.logos[stationId]) || 'assets/images/placeholder.svg';
        }

        function requireLogin() {
            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
            if (!token) {
                localStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function renderChannelList(activeId) {
            const list = document.getElementById('channelList');
            list.innerHTML = Object.keys(STATION_NAMES).map(id => `
                <div class="channel-item ${id === activeId ? 'active' : ''}" onclick="switchChannel('${id}')">
                    <img src="${getLogo(id)}" alt="${STATION_NAMES[id]}" onerror="this.style.opacity=0.3">
                    <span class="channel-item-name">${STATION_NAMES[id]}</span>
                    ${id === activeId ? '<span class="live-dot-small"></span>' : ''}
                </div>
            `).join('');
        }

        async function loadChannel(stationId) {
            currentStationId = stationId;
            document.getElementById('stationName').textContent = STATION_NAMES[stationId] || stationId;
            document.getElementById('stationLogo').src = getLogo(stationId);
            document.getElementById('playerError').classList.remove('visible');
            renderChannelList(stationId);

            try {
                const streamUrl = await UgandaTvApi.getStreamUrl(stationId);
                if (!streamUrl) { showStreamError(); return; }
                playStream(streamUrl);
            } catch (e) {
                showStreamError();
            }
        }

        function playStream(streamUrl) {
            if (!tvPlayer) {
                tvPlayer = videojs('tvVideoPlayer', {
                    controls: true,
                    autoplay: true,
                    liveui: true,
                    fluid: false,
                    html5: { vhs: { overrideNative: true } }
                });
                tvPlayer.on('error', showStreamError);
            }
            tvPlayer.src({ src: streamUrl, type: 'application/x-mpegURL' });
            tvPlayer.play().catch(() => {});
        }

        function showStreamError() {
            document.getElementById('playerError').classList.add('visible');
        }

        function retryStream() {
            if (currentStationId) loadChannel(currentStationId);
        }

        function switchChannel(stationId) {
            const url = new URL(window.location);
            url.searchParams.set('station', stationId);
            window.history.pushState({}, '', url);
            loadChannel(stationId);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
            if (!token) {
                localStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.href = 'login.html';
                return;
            }
            // Check paid subscription
            try {
                const res = await fetch(`${API_BASE}/api/auth/check-access`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!data.success || (data.access && data.access.freeUser)) {
                    window.location.replace('subscription.html?reason=free_plan&redirect=' + encodeURIComponent(window.location.href));
                    return;
                }
            } catch(e) { /* allow on error */ }

            const params = new URLSearchParams(window.location.search);
            const stationId = params.get('station') || 'nbs-tv';
            renderChannelList(stationId);
            loadChannel(stationId);
        });
    </script>
</body>
</html>
