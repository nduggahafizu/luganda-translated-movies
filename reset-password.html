<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password - Unruly Movies</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Set a new password for your Unruly Movies account">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4ade80">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="/assets/images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.05), rgba(0, 217, 255, 0.05));
        }

        .auth-box {
            background: var(--background-light);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo img {
            height: 50px;
            width: auto;
        }

        .auth-title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--background-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
        }

        .password-toggle-btn:hover {
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(74, 222, 128, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            font-size: 14px;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
            line-height: 1.5;
            display: none;
        }

        .form-message.success {
            display: block;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--primary-color);
        }

        .form-message.error {
            display: block;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff6b6b;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            color: var(--primary-color);
        }

        .back-home svg {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 40px 25px;
            }

            .auth-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <a href="login.html" class="back-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Login
    </a>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <img src="assets/images/logo-wordmark.png" alt="Unruly Movies">
            </div>

            <h1 class="auth-title">Set a New Password</h1>
            <p class="auth-subtitle" id="authSubtitle">Choose a new password for your account.</p>

            <div class="form-message" id="formMessage"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="password" class="form-label">New Password</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password" class="form-control" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('password', 'eyeIcon1')" aria-label="Toggle password visibility">
                            <svg id="eyeIcon1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <div class="password-toggle">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('confirmPassword', 'eyeIcon2')" aria-label="Toggle password visibility">
                            <svg id="eyeIcon2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Reset Password</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        const params = new URLSearchParams(window.location.search);
        // Also accept /reset-password/<token> style paths directly, in case
        // this page is ever reached without going through the server-side
        // redirect that normally turns that into ?token=.
        const pathToken = window.location.pathname.match(/reset-password\/([^/?]+)/)?.[1];
        const token = params.get('token') || pathToken;

        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            const msg = document.getElementById('formMessage');
            msg.className = 'form-message error';
            msg.textContent = 'This reset link is missing its token. Please request a new one from the forgot password page.';
            document.getElementById('authSubtitle').textContent = '';
        }

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('formMessage');
            messageEl.className = 'form-message';
            messageEl.textContent = '';

            if (password !== confirmPassword) {
                messageEl.className = 'form-message error';
                messageEl.textContent = 'Passwords don\'t match.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/api/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    if (data.data?.token) {
                        localStorage.setItem('token', data.data.token);
                    }
                    messageEl.className = 'form-message success';
                    messageEl.textContent = 'Password reset! Taking you to Unruly Movies now...';
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    messageEl.className = 'form-message error';
                    messageEl.textContent = data.message || 'That reset link is invalid or has expired. Please request a new one.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                messageEl.className = 'form-message error';
                messageEl.textContent = 'Network error. Please check your connection and try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>

    <footer class="site-footer" style="margin-top: 40px; padding: 20px; text-align: center;">
        <p style="color: #888; font-size: 14px;">Copyright © unruly movies watch 2026</p>
    </footer>
</body>
</html>
