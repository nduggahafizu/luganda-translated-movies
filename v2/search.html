<!DOCTYPE html>
<html lang="en">
<head>
    <title>Search — Unruly Movies V2 Preview</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4ade80">

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/card-grid.css">
    <link rel="stylesheet" href="/css/mobile-improvements.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="v2-badge">V2 PREVIEW</div>
    <div class="container">
        <div class="app">
            <div id="shellHeader"></div>

            <div class="app-wrapper">
                <div id="shellAside"></div>

                <!-- Main Content -->
                <div class="app-container flex-fill">
                    <div class="container">
                        <div class="app-content pt-md-3">

                            <div class="fragment" data-fragment="search">

                                <div class="v2-page-header">
                                    <h1>
                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <path d="m21 21-4.35-4.35"></path>
                                        </svg>
                                        Search
                                    </h1>
                                    <p>Find Luganda translated movies and series by title, VJ, or genre.</p>
                                </div>

                                <!-- Search input -->
                                <form class="filter-section" id="searchForm" style="margin-bottom: 14px;" onsubmit="return false;">
                                    <div class="filter-row">
                                        <div class="filter-group" style="flex: 1 1 100%;">
                                            <label class="filter-label" for="searchInput">Search</label>
                                            <input type="text" class="filter-select" id="searchInput" placeholder="Search by title, VJ, or genre..." autocomplete="off" style="width: 100%;">
                                        </div>
                                    </div>
                                </form>

                                <!-- Genre filter chips -->
                                <div class="chip-row" id="genreChips">
                                    <button class="filter-chip active" data-genre="">All</button>
                                    <button class="filter-chip" data-genre="action">Action</button>
                                    <button class="filter-chip" data-genre="comedy">Comedy</button>
                                    <button class="filter-chip" data-genre="drama">Drama</button>
                                    <button class="filter-chip" data-genre="horror">Horror</button>
                                    <button class="filter-chip" data-genre="sci-fi">Sci-Fi</button>
                                    <button class="filter-chip" data-genre="romance">Romance</button>
                                    <button class="filter-chip" data-genre="thriller">Thriller</button>
                                    <button class="filter-chip" data-genre="animation">Animation</button>
                                </div>

                                <p class="v2-result-count" id="resultCount"></p>

                                <div class="card-grid muno-style" id="searchGrid">
                                    <div class="loading-spinner">Loading...</div>
                                </div>

                                <div class="pagination" id="searchPagination"></div>

                            </div>

                        </div>
                    </div>
                </div>

                <div id="shellFooter"></div>
            </div>
        </div>
    </div>

    <!-- Scroll to Top -->
    <div class="scroll-up">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script>AppShell.mount('search');</script>
    <script src="/js/main.js"></script>
    <script src="/js/luganda-movies-api.js"></script>
    <script src="js/cards.js"></script>
    <script defer src="/js/app-shell.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
