<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payment — Unruly Movies</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4ade80">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #09090f; }
        .ps-wrap {
            max-width: 520px;
            margin: 80px auto;
            padding: 24px;
            text-align: center;
        }
        .ps-icon {
            width: 88px; height: 88px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
        }
        .ps-icon svg { width: 44px; height: 44px; }
        .ps-icon.loading { background: rgba(255,255,255,0.06); }
        .ps-icon.success { background: rgba(74,222,128,0.15); }
        .ps-icon.pending { background: rgba(255,215,0,0.12); }
        .ps-icon.failed  { background: rgba(255,68,68,0.12); }

        .ps-spinner {
            width: 44px; height: 44px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4ade80;
            animation: psSpin 0.8s linear infinite;
        }

        .ps-title {
            font-size: 26px; font-weight: 800;
            color: #fff; margin: 0 0 10px;
        }
        .ps-subtitle {
            font-size: 14px; color: #888;
            margin: 0 0 28px; line-height: 1.6;
        }
        .ps-card {
            background: #13131f;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }
        .ps-row {
            display: flex; justify-content: space-between;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .ps-row:last-child { border-bottom: none; }
        .ps-row-label { color: #666; }
        .ps-row-value { color: #fff; font-weight: 600; }
        .ps-btn {
            display: inline-block;
            padding: 13px 36px;
            border-radius: 50px;
            font-weight: 700; font-size: 15px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none; cursor: pointer;
        }
        .ps-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74,222,128,0.3); }
        .ps-btn.primary { background: #4ade80; color: #000; }
        .ps-btn.secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #aaa; margin-top: 10px;
        }
        @keyframes psSpin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="app">
            <div class="ps-wrap" id="psWrap">
                <!-- Populated by JS based on verify result -->
                <div class="ps-icon loading">
                    <div class="ps-spinner"></div>
                </div>
                <h1 class="ps-title">Verifying Payment…</h1>
                <p class="ps-subtitle">Please wait while we confirm your payment with PesaPal.</p>
                <div class="ps-card">
                    <div class="ps-row">
                        <span class="ps-row-label">Reference</span>
                        <span class="ps-row-value" id="psRef">—</span>
                    </div>
                    <div class="ps-row">
                        <span class="ps-row-label">Date</span>
                        <span class="ps-row-value" id="psDate">—</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');
        const isPopup = !!window.opener;

        function notifyOpener(status, extra) {
            if (!isPopup) return;
            try {
                window.opener.postMessage(Object.assign({ type: 'pesapal-payment-complete', status, ref }, extra || {}), window.location.origin);
            } catch (e) {}
        }

        document.getElementById('psRef').textContent = ref || '—';
        document.getElementById('psDate').textContent = new Date().toLocaleDateString('en-UG', {
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });

        function showState(type, title, subtitle, actionHtml) {
            const iconMap = {
                loading: `<div class="ps-spinner"></div>`,
                success: `<svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
                pending: `<svg viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`,
                failed:  `<svg viewBox="0 0 24 24" fill="none" stroke="#ff4444" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`
            };

            document.querySelector('.ps-icon').className = `ps-icon ${type}`;
            document.querySelector('.ps-icon').innerHTML = iconMap[type];
            document.querySelector('.ps-title').textContent = title;
            document.querySelector('.ps-subtitle').innerHTML = subtitle;

            const existing = document.getElementById('psAction');
            if (existing) existing.remove();
            if (actionHtml) {
                const div = document.createElement('div');
                div.id = 'psAction';
                div.innerHTML = actionHtml;
                document.getElementById('psWrap').appendChild(div);
            }
        }

        async function verifyPayment() {
            if (!ref) {
                showState('failed', 'Missing Reference', 'No payment reference found in the URL.', `<a href="subscription.html" class="ps-btn primary">Try Again</a>`);
                return;
            }

            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
            if (!token) {
                showState('failed', 'Not Logged In', 'Please log in to verify your payment.', `<a href="login.html" class="ps-btn primary">Log In</a>`);
                return;
            }

            try {
                const res = await fetch(`${API_CONFIG.BASE_URL}/api/payments/pesapal/verify/${ref}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.status === 'success') {
                    notifyOpener('success', { plan: data.plan });
                    if (isPopup) {
                        showState('success', 'Payment Confirmed!', 'You can close this window.', null);
                        setTimeout(() => { try { window.close(); } catch (_) {} }, 1200);
                    } else {
                        showState('success', 'Payment Successful!',
                            `Your <strong style="color:#fff">${data.plan || ''}</strong> plan is now active. Enjoy Unruly Movies!`,
                            `<a href="index.html" class="ps-btn primary">Start Watching</a>`
                        );
                        setTimeout(() => {
                            try { window.close(); } catch (_) {}
                            setTimeout(() => { window.location.href = 'profile.html'; }, 800);
                        }, 2000);
                    }

                } else if (data.status === 'pending') {
                    showState('pending', 'Payment Processing',
                        'PesaPal is still confirming your payment. This usually takes a few seconds.',
                        null
                    );
                    setTimeout(verifyPayment, 5000);

                } else {
                    notifyOpener('failed', { message: data.message });
                    if (isPopup) {
                        showState('failed', 'Payment Failed', 'You can close this window and try again.', null);
                        setTimeout(() => { try { window.close(); } catch (_) {} }, 1800);
                    } else {
                        showState('failed', 'Payment Failed',
                            (data.message || 'Your payment could not be completed.') +
                            '<br><br>No money has been taken from your account. Please try again.',
                            `<a href="subscription.html" class="ps-btn primary">Try Again</a>
                             <br><a href="index.html" class="ps-btn secondary">Back to Home</a>`
                        );
                    }
                }

            } catch (e) {
                showState('pending', 'Verifying…',
                    'Still checking your payment status. Please wait.',
                    null
                );
                setTimeout(verifyPayment, 5000);
            }
        }

        verifyPayment();
    </script>
</body>
</html>
