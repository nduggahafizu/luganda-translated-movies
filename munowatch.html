<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munowatch Movies - Unruly Movies</title>

    <meta name="description" content="Browse Munowatch movies collection on Unruly Movies. Watch Luganda translated films.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="css/app-shell.css">
    <style>
        :root {
            --primary: #e50914;
            --dark-bg: #141414;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --text-muted: #808080;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .logo span {
            color: var(--text);
        }
        
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
        }
        
        .back-link:hover {
            color: var(--text);
        }
        
        .player-section {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .video-container {
            position: relative;
            padding-top: 56.25%; /* 16:9 */
        }
        
        .video-container video,
        .video-container .plyr {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .movie-info {
            padding: 20px;
            background: var(--card-bg);
        }
        
        .movie-title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .movie-meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .movie-description {
            line-height: 1.6;
            color: #ccc;
        }
        
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .movie-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
        }
        
        .movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        
        .movie-card-info {
            padding: 12px;
        }
        
        .movie-card-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .movie-card-year {
            color: var(--text-muted);
            font-size: 12px;
        }
        
        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary);
            border-radius: 2px;
        }
        
        .url-input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .url-input-group {
            display: flex;
            gap: 10px;
        }
        
        .url-input {
            flex: 1;
            padding: 12px 16px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        
        .url-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #f40612;
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .loading.active {
            display: block;
        }
        
        .error-message {
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid var(--primary);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.active {
            display: block;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-badge.direct {
            background: #28a745;
        }
        
        .status-badge.proxy {
            background: #ffc107;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Unruly<span>Movies</span> - Munowatch</div>
            <a href="/" class="back-link"> Back to Home</a>
        </header>
        
        <!-- URL Input Section -->
        <div class="url-input-section">
            <h3 style="margin-bottom: 15px;">Play Munowatch Video</h3>
            <div class="url-input-group">
                <input type="text" class="url-input" id="videoUrl" 
                       placeholder="Enter Munowatch URL or CDN video link (e.g., http://munotech2.b-cdn.net/simo/...)">
                <button class="btn" id="playBtn" onclick="playFromUrl()">Play</button>
            </div>
            <p style="margin-top: 10px; color: var(--text-muted); font-size: 12px;">
                You can also paste direct CDN URLs from Munowatch
            </p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <!-- Player Section -->
        <div class="player-section" id="playerSection" style="display: none;">
            <div class="video-container">
                <video id="player" playsinline controls>
                    <source src="" type="video/mp4">
                </video>
            </div>
            <div class="movie-info">
                <h1 class="movie-title" id="currentTitle">Loading...</h1>
                <div class="movie-meta" id="currentMeta">
                    <span class="status-badge direct" id="statusBadge">Direct CDN</span>
                </div>
                <p class="movie-description" id="currentDescription"></p>
            </div>
        </div>
        
        <!-- Known Working Movies -->
        <section>
            <h2 class="section-title">Available Movies</h2>
            <div class="loading active" id="loading">Loading movies...</div>
            <div class="movies-grid" id="moviesGrid"></div>
        </section>
        
        <!-- Dashboard Movies from Munowatch API -->
        <section style="margin-top: 40px;">
            <h2 class="section-title">Munowatch Dashboard</h2>
            <div class="loading" id="dashboardLoading">Loading from Munowatch...</div>
            <div class="movies-grid" id="dashboardGrid"></div>
        </section>
    </div>
    
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="/js/munowatch-api.js"></script>
    <script>
        // Initialize Plyr player
        let player;
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Plyr
            player = new Plyr('#player', {
                controls: [
                    'play-large', 'rewind', 'play', 'fast-forward', 
                    'progress', 'current-time', 'duration', 'mute', 
                    'volume', 'settings', 'pip', 'airplay', 'fullscreen'
                ],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
            });
            
            // Load known movies
            await loadKnownMovies();
            
            // Load dashboard
            await loadDashboard();
        });
        
        async function loadKnownMovies() {
            try {
                const result = await MunowatchAPI.getKnownMovies();
                
                document.getElementById('loading').classList.remove('active');
                
                if (result.success && result.data.length > 0) {
                    renderMovies(result.data, 'moviesGrid');
                } else {
                    // Add The Internship as fallback
                    const fallbackMovies = [{
                        id: 'the-internship',
                        title: 'The Internship',
                        videoUrl: 'http://munotech2.b-cdn.net/simo/simo22/The.Internship.mp4',
                        poster: 'https://image.tmdb.org/t/p/w500/mhzKnHWEQPTG8BByurCUXqB5HKS.jpg',
                        year: 2013,
                        description: 'Two salesmen whose careers have been torpedoed by the digital age find their way into a coveted internship at Google.'
                    }];
                    renderMovies(fallbackMovies, 'moviesGrid');
                }
            } catch (error) {
                console.error('Error loading movies:', error);
                document.getElementById('loading').textContent = 'Error loading movies';
            }
        }
        
        async function loadDashboard() {
            document.getElementById('dashboardLoading').classList.add('active');
            
            try {
                const result = await MunowatchAPI.getDashboard();
                
                document.getElementById('dashboardLoading').classList.remove('active');
                
                if (result.success && result.data) {
                    // Parse dashboard data and extract movies
                    const movies = parseDashboardMovies(result.data);
                    renderMovies(movies, 'dashboardGrid');
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('dashboardLoading').textContent = 'Could not load Munowatch dashboard';
            }
        }
        
        function parseDashboardMovies(data) {
            const movies = [];
            
            // Extract from banner if available
            if (data.banner && Array.isArray(data.banner)) {
                data.banner.forEach(item => {
                    if (item.moviename && item.banner) {
                        movies.push({
                            id: item.id || item.moviename,
                            title: item.moviename,
                            poster: item.banner,
                            description: item.description || '',
                            // Note: playingurl is often empty, would need Preview API
                            videoUrl: item.playingurl || null
                        });
                    }
                });
            }
            
            // Extract from other sections
            ['recently_uploaded', 'trending', 'popular'].forEach(section => {
                if (data[section] && Array.isArray(data[section])) {
                    data[section].forEach(item => {
                        if (item.moviename && !movies.find(m => m.title === item.moviename)) {
                            movies.push({
                                id: item.id || item.moviename,
                                title: item.moviename,
                                poster: item.banner || item.poster || '',
                                description: item.description || '',
                                videoUrl: item.playingurl || null
                            });
                        }
                    });
                }
            });
            
            return movies;
        }
        
        function renderMovies(movies, containerId) {
            const container = document.getElementById(containerId);
            
            if (!movies || movies.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No movies available</p>';
                return;
            }
            
            container.innerHTML = movies.map(movie => 
                <div class="movie-card" onclick="playMovie('"\"')">
                    <img src="\" 
                         alt="\"
                         onerror="this.src='/assets/images/placeholder.svg'">
                    <div class="movie-card-info">
                        <div class="movie-card-title">\</div>
                        <div class="movie-card-year">\</div>
                    </div>
                </div>
            ).join('');
        }
        
        function playMovie(encodedMovie) {
            const movie = JSON.parse(decodeURIComponent(encodedMovie));
            
            if (movie.videoUrl) {
                playVideo(movie.videoUrl, movie.title, movie.description, false);
            } else {
                showError(No direct video URL available for "\". The video URL is protected by Munowatch's auth system.);
            }
        }
        
        function playFromUrl() {
            const url = document.getElementById('videoUrl').value.trim();
            
            if (!url) {
                showError('Please enter a video URL');
                return;
            }
            
            // Determine if it's a direct CDN URL or needs extraction
            if (url.includes('b-cdn.net') || url.endsWith('.mp4')) {
                playVideo(url, 'Custom Video', 'Playing from provided URL', false);
            } else if (url.includes('munowatch.com')) {
                // Would need extraction
                extractAndPlay(url);
            } else {
                playVideo(url, 'Custom Video', 'Playing from provided URL', true);
            }
        }
        
        async function extractAndPlay(url) {
            document.getElementById('playBtn').disabled = true;
            document.getElementById('playBtn').textContent = 'Extracting...';
            
            try {
                const result = await MunowatchAPI.extractVideo(url);
                
                if (result.success && result.videoUrl) {
                    playVideo(result.videoUrl, result.title || 'Munowatch Video', '', false);
                } else {
                    showError(result.message || 'Could not extract video URL. The video may require authentication.');
                }
            } catch (error) {
                showError('Failed to extract video: ' + error.message);
            }
            
            document.getElementById('playBtn').disabled = false;
            document.getElementById('playBtn').textContent = 'Play';
        }
        
        function playVideo(url, title, description, useProxy = false) {
            hideError();
            
            const playerSection = document.getElementById('playerSection');
            playerSection.style.display = 'block';
            
            // Scroll to player
            playerSection.scrollIntoView({ behavior: 'smooth' });
            
            // Update info
            document.getElementById('currentTitle').textContent = title;
            document.getElementById('currentDescription').textContent = description;
            
            const statusBadge = document.getElementById('statusBadge');
            if (useProxy) {
                statusBadge.className = 'status-badge proxy';
                statusBadge.textContent = 'Proxied Stream';
            } else {
                statusBadge.className = 'status-badge direct';
                statusBadge.textContent = 'Direct CDN';
            }
            
            // Play video
            const videoSrc = useProxy ? MunowatchAPI.getProxyStreamUrl(url) : url;
            player.source = {
                type: 'video',
                sources: [{
                    src: videoSrc,
                    type: 'video/mp4'
                }]
            };
            
            player.play().catch(e => console.log('Autoplay blocked:', e));
        }
        
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }
        
        function hideError() {
            document.getElementById('errorMessage').classList.remove('active');
        }
    </script>
    <script defer src="js/app-shell.js"></script>
</body>
</html>
