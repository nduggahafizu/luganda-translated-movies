<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage Users - Admin - Unruly Movies</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #09090f; color: #fff; min-height: 100vh; }
        a { color: #4ade80; text-decoration: none; }

        .top-bar { background: #111; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
        .top-bar h1 { font-size: 18px; font-weight: 700; }
        .top-bar a { color: #888; font-size: 13px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat { background: #161620; border: 1px solid #222; border-radius: 12px; padding: 16px; text-align: center; }
        .stat-val { font-size: 28px; font-weight: 800; color: #4ade80; }
        .stat-lbl { font-size: 12px; color: #888; margin-top: 4px; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .toolbar input, .toolbar select { background: #161620; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
        .toolbar input { flex: 1; min-width: 200px; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #888; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #222; }
        td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
        tr:hover { background: rgba(74,222,128,0.03); }

        .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge.admin { background: rgba(74,222,128,0.15); color: #4ade80; }
        .badge.user { background: rgba(255,255,255,0.06); color: #888; }
        .badge.free { background: rgba(255,255,255,0.06); color: #888; }
        .badge.daily, .badge.weekly, .badge.biweekly, .badge.monthly,
        .badge.basic, .badge.standard { background: rgba(0,217,255,0.15); color: #00d9ff; }
        .badge.active { background: rgba(74,222,128,0.15); color: #4ade80; }
        .badge.expired, .badge.inactive { background: rgba(255,68,68,0.15); color: #ff4444; }

        .btn-edit { background: none; border: 1px solid #333; color: #4ade80; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-edit:hover { background: rgba(74,222,128,0.1); }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .pagination button { background: #161620; border: 1px solid #333; color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .pagination button.active { background: #4ade80; color: #000; border-color: #4ade80; }
        .pagination button:disabled { opacity: 0.3; cursor: default; }

        /* Modal */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; }
        .modal-bg.open { display: flex; }
        .modal-box { background: #1a1a2e; border: 1px solid #333; border-radius: 16px; padding: 28px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
        .modal-box h2 { font-size: 18px; margin-bottom: 20px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .modal-box h2 button { background: none; border: none; color: #888; cursor: pointer; font-size: 20px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        .field input, .field select { width: 100%; padding: 10px 12px; background: #0d0d14; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; }
        .field input:focus, .field select:focus { border-color: #4ade80; outline: none; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .sub-info { background: #0d0d14; border: 1px solid #222; border-radius: 8px; padding: 12px; font-size: 12px; color: #888; margin-bottom: 16px; }
        .sub-info strong { color: #fff; }
        .btn-save { width: 100%; padding: 12px; background: #4ade80; color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; }
        .btn-save:hover { background: #6ee7a0; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; z-index: 100000; }
        .toast.success { background: #4ade80; color: #000; }
        .toast.error { background: #ff4444; color: #fff; }

        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            table { font-size: 12px; }
            td, th { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Manage Users</h1>
        <div><a href="admin.html">Dashboard</a> &nbsp;|&nbsp; <a href="index.html">Site</a></div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat"><div class="stat-val" id="totalUsers">-</div><div class="stat-lbl">Total Users</div></div>
            <div class="stat"><div class="stat-val" id="activeUsers">-</div><div class="stat-lbl">Active</div></div>
            <div class="stat"><div class="stat-val" id="paidUsers">-</div><div class="stat-lbl">Paid Plans</div></div>
            <div class="stat"><div class="stat-val" id="adminCount">-</div><div class="stat-lbl">Admins</div></div>
        </div>

        <div class="toolbar">
            <input type="text" id="search" placeholder="Search by name or email...">
            <select id="roleFilter"><option value="">All Roles</option><option value="user">User</option><option value="admin">Admin</option></select>
            <select id="planFilter"><option value="">All Plans</option><option value="free">Free</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="biweekly">2 Weeks</option><option value="monthly">Monthly</option></select>
        </div>

        <table>
            <thead><tr><th>User</th><th>Role</th><th>Plan</th><th>Status</th><th>Joined</th><th>Action</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-bg" id="modal">
        <div class="modal-box">
            <h2>Edit User <button onclick="closeModal()">&times;</button></h2>
            <form id="editForm">
                <input type="hidden" id="uid">
                <div class="field"><label>Name</label><input id="fname" readonly style="opacity:0.6;"></div>
                <div class="field"><label>Email</label><input id="femail" readonly style="opacity:0.6;"></div>
                <div class="field-row">
                    <div class="field"><label>Role</label><select id="frole"><option value="user">User</option><option value="admin">Admin</option></select></div>
                    <div class="field"><label>Account</label><select id="factive"><option value="true">Active</option><option value="false">Banned</option></select></div>
                </div>
                <h3 style="color:#4ade80;font-size:13px;margin:16px 0 12px;border-top:1px solid #222;padding-top:16px;">Subscription Plan</h3>
                <div class="field-row">
                    <div class="field"><label>Plan</label><select id="fplan" onchange="document.getElementById('fdays').value=({free:0,daily:1,weekly:7,biweekly:14,monthly:30})[this.value]"><option value="free">Free (No downloads)</option><option value="daily">Daily (1 day)</option><option value="weekly">Weekly (7 days)</option><option value="biweekly">2 Weeks (14 days)</option><option value="monthly">Monthly (30 days)</option></select></div>
                    <div class="field"><label>Duration (days)</label><input type="number" id="fdays" value="7" min="1" max="365"></div>
                </div>
                <div class="sub-info" id="subInfo">-</div>
                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const API = (typeof API_CONFIG !== 'undefined' ? API_CONFIG.BASE_URL : 'http://localhost:5000') + '/api';
        const token = localStorage.getItem('token');
        let allUsers = [];
        let page = 1;
        let pages = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('user');
            if (!token || !userData) { window.location.href = 'login.html'; return; }
            const user = JSON.parse(userData);
            if (user.role !== 'admin') { alert('Admin only'); window.location.href = 'index.html'; return; }
            loadUsers();

            let t;
            document.getElementById('search').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { page = 1; loadUsers(); }, 300); });
            document.getElementById('roleFilter').addEventListener('change', () => { page = 1; loadUsers(); });
            document.getElementById('planFilter').addEventListener('change', () => { page = 1; loadUsers(); });
            document.getElementById('editForm').addEventListener('submit', saveUser);
        });

        async function loadUsers() {
            let url = `${API}/admin/users?page=${page}&limit=20`;
            const search = document.getElementById('search').value;
            const role = document.getElementById('roleFilter').value;
            const plan = document.getElementById('planFilter').value;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (role) url += `&role=${role}`;
            if (plan) url += `&plan=${plan}`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.success || data.status === 'success') {
                    allUsers = data.data || [];
                    pages = data.pagination?.pages || 1;
                    renderTable();
                    renderPagination();
                    updateStats();
                }
            } catch (e) { console.error(e); }
        }

        function renderTable() {
            const tbody = document.getElementById('tbody');
            if (!allUsers.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#888;">No users found</td></tr>'; return; }

            tbody.innerHTML = allUsers.map(u => {
                const plan = u.subscription?.plan || 'free';
                const status = u.isActive !== false ? 'active' : 'inactive';
                const date = new Date(u.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                return `<tr>
                    <td><strong>${esc(u.fullName || 'No Name')}</strong><br><span style="color:#888;font-size:11px;">${esc(u.email)}</span></td>
                    <td><span class="badge ${u.role || 'user'}">${u.role || 'user'}</span></td>
                    <td><span class="badge ${plan}">${plan}</span></td>
                    <td><span class="badge ${status}">${status}</span></td>
                    <td>${date}</td>
                    <td><button class="btn-edit" onclick="editUser('${u._id}')">Edit</button></td>
                </tr>`;
            }).join('');
        }

        function renderPagination() {
            const el = document.getElementById('pagination');
            if (pages <= 1) { el.innerHTML = ''; return; }
            let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="page--;loadUsers()">Prev</button>`;
            for (let i = 1; i <= pages; i++) html += `<button class="${i === page ? 'active' : ''}" onclick="page=${i};loadUsers()">${i}</button>`;
            html += `<button ${page >= pages ? 'disabled' : ''} onclick="page++;loadUsers()">Next</button>`;
            el.innerHTML = html;
        }

        async function updateStats() {
            try {
                const res = await fetch(`${API}/admin/dashboard`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const o = data.data?.overview || data.data || {};
                document.getElementById('totalUsers').textContent = o.totalUsers || allUsers.length;
                document.getElementById('activeUsers').textContent = o.activeSubscriptions || 0;
                document.getElementById('paidUsers').textContent = o.premiumUsers || 0;
                document.getElementById('adminCount').textContent = allUsers.filter(u => u.role === 'admin').length;
            } catch (e) {}
        }

        function editUser(userId) {
            const user = allUsers.find(u => u._id === userId);
            if (!user) return;

            document.getElementById('uid').value = user._id;
            document.getElementById('fname').value = user.fullName || '';
            document.getElementById('femail').value = user.email || '';
            document.getElementById('frole').value = user.role || 'user';
            document.getElementById('factive').value = user.isActive !== false ? 'true' : 'false';

            const planDays = { free: 0, daily: 1, weekly: 7, biweekly: 14, monthly: 30 };
            const plan = (user.subscription && user.subscription.plan) || 'free';
            const planEl = document.getElementById('fplan');
            planEl.value = plan in planDays ? plan : 'free';
            document.getElementById('fdays').value = planDays[plan] || 7;

            const sub = user.subscription || {};
            const endDate = sub.endDate ? new Date(sub.endDate) : null;
            const isActive = sub.status === 'active' && endDate && endDate > new Date();
            const hasDownload = plan !== 'free' && isActive;
            let info = '<strong>' + plan.toUpperCase() + '</strong> | ' + (sub.status || 'none');
            if (endDate) {
                const rem = endDate.getTime() - Date.now();
                info += rem > 0 ? ' | ' + Math.floor(rem / 86400000) + 'd ' + Math.floor((rem % 86400000) / 3600000) + 'h left' : ' | <span style="color:#ff4444;">Expired</span>';
            }
            info += ' | Download: ' + (hasDownload ? '<span style="color:#4ade80;">Yes</span>' : '<span style="color:#ff4444;">No</span>');
            document.getElementById('subInfo').innerHTML = info;

            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        async function saveUser(e) {
            e.preventDefault();
            const userId = document.getElementById('uid').value;
            const plan = document.getElementById('fplan').value;
            const days = parseInt(document.getElementById('fdays').value) || 0;

            const subscription = { plan };
            if (plan !== 'free' && days > 0) {
                subscription.status = 'active';
                subscription.startDate = new Date().toISOString();
                subscription.endDate = new Date(Date.now() + days * 86400000).toISOString();
            } else if (plan === 'free') {
                subscription.status = 'inactive';
                subscription.endDate = null;
            }

            try {
                const res = await fetch(`${API}/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        role: document.getElementById('frole').value,
                        isActive: document.getElementById('factive').value === 'true',
                        subscription
                    })
                });
                const data = await res.json();
                if (data.success || data.status === 'success') {
                    toast('User updated', 'success');
                    closeModal();
                    loadUsers();
                } else {
                    toast(data.message || 'Failed', 'error');
                }
            } catch (err) {
                toast('Error: ' + err.message, 'error');
            }
        }

        function toast(msg, type) {
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    </script>
</body>
</html>
