<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="theme-color" content="#4ade80">

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/card-grid.css">
    <link rel="stylesheet" href="/css/mobile-improvements.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="css/app.css">

<body>
    <div class="v2-badge">V2 PREVIEW</div>
    <div class="container">
        <div class="app">

            <div class="app-wrapper">

                            <div class="fragment" data-fragment="vjs">

                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path><path d="M12 14a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path><path d="M1 19a6 6 0 0 1 12 0"></path></svg>

                                </div>

                                <div class="vj-grid" id="vjGrid">

                                </div>

                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scroll to Top -->
    <div class="scroll-up">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="js/shell.js"></script>

    <script src="/js/main.js"></script>
    <script src="/js/luganda-movies-api.js"></script>

    <script defer src="/js/app-shell.js"></script>
