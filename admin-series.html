<!DOCTYPE html>
<html lang="en">
<head>
    <title>Manage TV Series - Admin Dashboard</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .admin-header h1 {
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-admin {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .btn-admin:hover {
            background: #9dff44;
            transform: translateY(-2px);
        }
        
        .btn-admin.secondary {
            background: var(--background-light);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-admin.danger {
            background: #ef4444;
            color: #fff;
        }
        
        /* Series Grid */
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .series-card {
            background: var(--background-light);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }
        
        .series-card:hover {
            transform: translateY(-5px);
        }
        
        .series-card-header {
            display: flex;
            gap: 15px;
            padding: 20px;
        }
        
        .series-poster {
            width: 100px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }
        
        .series-details h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .series-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        
        .series-meta span {
            display: block;
            margin-bottom: 4px;
        }
        
        .series-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: var(--background-dark);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .stat.published { color: var(--primary-color); }
        .stat.draft { color: #ffd700; }
        
        .series-card-actions {
            display: flex;
            border-top: 1px solid var(--border-color);
        }
        
        .series-card-actions button,
        .series-card-actions a {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .series-card-actions button:hover,
        .series-card-actions a:hover {
            background: rgba(124, 252, 0, 0.1);
            color: var(--primary-color);
        }
        
        .series-card-actions button.delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        
        /* Episodes Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            overflow-y: auto;
            padding: 40px 20px;
        }
        
        .modal-overlay.active {
            display: block;
        }
        
        .modal-content {
            max-width: 900px;
            margin: 0 auto;
            background: var(--background-light);
            border-radius: 20px;
            overflow: hidden;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-header h2 {
            font-size: 20px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .modal-body {
            padding: 25px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        /* Season Accordion */
        .season-accordion {
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .season-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--background-dark);
            cursor: pointer;
        }
        
        .season-header h4 {
            font-size: 16px;
        }
        
        .season-header .episode-count {
            color: var(--text-secondary);
            font-size: 13px;
        }
        
        .season-episodes {
            display: none;
            padding: 15px;
        }
        
        .season-episodes.open {
            display: block;
        }
        
        /* Episode Row */
        .episode-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: var(--background-dark);
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .episode-row img {
            width: 80px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
        }
        
        .episode-info {
            flex: 1;
        }
        
        .episode-info h5 {
            font-size: 14px;
            margin-bottom: 3px;
        }
        
        .episode-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .episode-actions {
            display: flex;
            gap: 10px;
        }
        
        .episode-actions input {
            width: 250px;
            padding: 8px 12px;
            background: var(--background-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
        }
        
        .episode-actions button {
            padding: 8px 15px;
            background: var(--primary-color);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
        
        .episode-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
        }
        
        .episode-status.available {
            background: rgba(124, 252, 0, 0.2);
            color: var(--primary-color);
        }
        
        .episode-status.unavailable {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state h2 {
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .series-grid {
                grid-template-columns: 1fr;
            }
            
            .episode-row {
                flex-direction: column;
                align-items: stretch;
            }
            
            .episode-actions {
                flex-direction: column;
            }
            
            .episode-actions input {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>📺 TV Series Management</h1>
            <div style="display: flex; gap: 10px;">
                <a href="admin.html" class="btn-admin secondary">← Back to Dashboard</a>
                <button onclick="openImportModal()" class="btn-admin">+ Import New Series</button>
            </div>
        </header>
        
        <main id="series-list">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading series...</p>
            </div>
        </main>
    </div>
    
    <!-- Episodes Modal -->
    <div id="episodesModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Manage Episodes</h2>
                <button class="modal-close" onclick="closeEpisodesModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Episodes will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = (window.API_CONFIG && window.API_CONFIG.BASE_URL)
            ? window.API_CONFIG.BASE_URL
            : ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? 'http://localhost:5000'
                : 'https://luganda-translated-movies-production.up.railway.app');
        
        let allSeries = [];
        let currentSeriesId = null;
        let currentSeries = null;
        
        // Check admin auth
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html?redirect=admin-series.html';
                return;
            }
            
            // Verify admin role
            try {
                const user = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || '{}');
                if (!user.role || user.role !== 'admin') {
                    const response = await fetch(`${API_BASE_URL}/api/auth/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (!data.success || data.data.role !== 'admin') {
                        alert('Access denied. Admin privileges required.');
                        window.location.href = 'index.html';
                        return;
                    }
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'login.html?redirect=admin-series.html';
                return;
            }
            
            loadSeries();
        });
        
        async function loadSeries() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            const container = document.getElementById('series-list');
            
            container.innerHTML = `
                <div style="text-align: center; padding: 60px;">
                    <div class="spinner" style="width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;"></div>
                    <p style="color: var(--text-secondary);">Loading series...</p>
                </div>
            `;
            
            try {
                // Try admin endpoint first
                let response = await fetch(`${API_BASE_URL}/api/admin/series?limit=100`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                let data = await response.json();
                
                if (!data.status || data.status !== 'success') {
                    // Fallback to regular endpoint
                    response = await fetch(`${API_BASE_URL}/api/luganda-movies?contentType=series&limit=100`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    data = await response.json();
                    allSeries = (data.data || []).filter(item => item.contentType === 'series');
                } else {
                    allSeries = data.data || [];
                }
                
                renderSeries();
            } catch (error) {
                console.error('Error loading series:', error);
                container.innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 60px;">
                        <h2 style="color: #ef4444;">❌ Error Loading Series</h2>
                        <p style="color: var(--text-secondary);">${error.message}</p>
                        <button onclick="loadSeries()" class="btn-admin" style="margin-top: 15px;">Try Again</button>
                    </div>
                `;
            }
        }
        
        function renderSeries() {
            const container = document.getElementById('series-list');
            
            if (allSeries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 60px;">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" style="margin-bottom: 20px;">
                            <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                            <polyline points="17 2 12 7 7 2"></polyline>
                        </svg>
                        <h2 style="margin-bottom: 10px;">📺 No TV Series Yet</h2>
                        <p style="color: var(--text-secondary); margin-bottom: 20px;">Import your first TV series from TMDB to get started.</p>
                        <button onclick="openImportModal()" class="btn-admin">+ Import Series</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="series-grid">
                    ${allSeries.map(series => `
                        <div class="series-card" data-id="${series._id}">
                            <div class="series-card-header">
                                <img src="${series.poster || '/assets/images/placeholder.svg'}" 
                                     alt="${series.originalTitle}" class="series-poster"
                                     onerror="this.src='/assets/images/placeholder.svg'">
                                <div class="series-details">
                                    <h3>${series.lugandaTitle || series.originalTitle}</h3>
                                    <div class="series-meta">
                                        <span>📅 ${series.year || 'Unknown Year'}</span>
                                        <span>⭐ ${(series.rating?.imdb || series.imdbRating || 0).toFixed(1)}</span>
                                        ${series.vjName ? `<span>🎙️ ${series.vjName}</span>` : ''}
                                    </div>
                                    <div class="series-stats">
                                        <span class="stat">📺 ${series.totalSeasons || series.seasons?.length || 0} Seasons</span>
                                        <span class="stat">🎬 ${series.totalEpisodes || countEpisodes(series)} Episodes</span>
                                        <span class="stat ${series.status || 'draft'}">${(series.status || 'draft').toUpperCase()}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="series-card-actions">
                                <button onclick="openEpisodesModal('${series._id}')" title="Manage Episodes">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                                        <line x1="7" y1="2" x2="7" y2="22"></line>
                                        <line x1="17" y1="2" x2="17" y2="22"></line>
                                    </svg>
                                    Episodes
                                </button>
                                <a href="series-detail.html?id=${series._id}" target="_blank" title="Preview">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    Preview
                                </a>
                                <button onclick="togglePublish('${series._id}', '${series.status}')" title="${series.status === 'published' ? 'Unpublish' : 'Publish'}">
                                    ${series.status === 'published' ? 
                                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg> Hide' : 
                                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> Publish'
                                    }
                                </button>
                                <button class="delete" onclick="deleteSeries('${series._id}')" title="Delete">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                    Delete
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        function countEpisodes(series) {
            if (!series.seasons) return 0;
            return series.seasons.reduce((total, s) => total + (s.episodes?.length || 0), 0);
        }
        
        async function openEpisodesModal(seriesId) {
            currentSeriesId = seriesId;
            currentSeries = allSeries.find(s => s._id === seriesId);
            
            if (!currentSeries) {
                alert('Series not found');
                return;
            }
            
            document.getElementById('modalTitle').textContent = `📺 ${currentSeries.lugandaTitle || currentSeries.originalTitle}`;
            document.getElementById('episodesModal').classList.add('active');
            
            renderEpisodes(currentSeries);
        }
        
        function closeEpisodesModal() {
            document.getElementById('episodesModal').classList.remove('active');
            currentSeriesId = null;
            currentSeries = null;
        }
        
        function renderEpisodes(series) {
            const container = document.getElementById('modalBody');
            
            if (!series.seasons || series.seasons.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5" style="margin-bottom: 15px;">
                            <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                            <polyline points="17 2 12 7 7 2"></polyline>
                        </svg>
                        <h3 style="margin-bottom: 10px;">No Seasons Added</h3>
                        <p style="color: var(--text-secondary); margin-bottom: 20px;">Add a season to start managing episodes.</p>
                        <button onclick="addSeason()" class="btn-admin">+ Add Season</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <span style="color: var(--text-secondary);">${series.seasons.length} Season${series.seasons.length !== 1 ? 's' : ''} • ${countEpisodes(series)} Episodes</span>
                    <button onclick="addSeason()" class="btn-admin secondary" style="padding: 8px 16px; font-size: 13px;">+ Add Season</button>
                </div>
                ${series.seasons.map(season => `
                    <div class="season-accordion">
                        <div class="season-header" onclick="toggleSeason(this)">
                            <h4>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                                Season ${season.seasonNumber} ${season.name ? `- ${season.name}` : ''}
                            </h4>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span class="episode-count">${season.episodes?.length || 0} Episodes</span>
                                <button onclick="event.stopPropagation(); addEpisode(${season.seasonNumber})" class="btn-admin secondary" style="padding: 5px 12px; font-size: 12px;">+ Episode</button>
                            </div>
                        </div>
                        <div class="season-episodes">
                            ${!season.episodes || season.episodes.length === 0 ? `
                                <div style="text-align: center; padding: 20px; color: var(--text-secondary);">
                                    No episodes in this season. <button onclick="addEpisode(${season.seasonNumber})" style="color: var(--primary-color); background: none; border: none; cursor: pointer;">Add one</button>
                                </div>
                            ` : season.episodes.map(episode => `
                                <div class="episode-row">
                                    <img src="${episode.thumbnail || episode.stillPath || series.poster || '/assets/images/placeholder.svg'}" 
                                         alt="Episode ${episode.episodeNumber}"
                                         onerror="this.src='/assets/images/placeholder.svg'">
                                    <div class="episode-info">
                                        <h5>E${episode.episodeNumber}: ${episode.title || episode.name || 'Episode ' + episode.episodeNumber}</h5>
                                        <p>${episode.duration || episode.runtime ? (episode.duration || episode.runtime) + ' min' : 'Duration not set'}</p>
                                    </div>
                                    <span class="episode-status ${episode.video?.embedUrl || episode.video ? 'available' : 'unavailable'}">
                                        ${episode.video?.embedUrl || episode.video ? '✅ Ready' : '⚠️ No Video'}
                                    </span>
                                    <div class="episode-actions">
                                        <input type="text" 
                                               id="url_${season.seasonNumber}_${episode.episodeNumber}"
                                               placeholder="Video URL (Streamtape, Archive.org...)"
                                               value="${episode.video?.embedUrl || episode.video || ''}">
                                        <button onclick="saveEpisodeUrl(${season.seasonNumber}, ${episode.episodeNumber})" class="btn-admin" style="padding: 8px 12px;">
                                            💾 Save
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
            `;
        }
        
        function toggleSeason(header) {
            const episodes = header.nextElementSibling;
            const isOpen = episodes.classList.contains('open');
            
            // Close all other seasons
            document.querySelectorAll('.season-episodes.open').forEach(el => el.classList.remove('open'));
            document.querySelectorAll('.season-header.active').forEach(el => el.classList.remove('active'));
            
            if (!isOpen) {
                episodes.classList.add('open');
                header.classList.add('active');
            }
        }
        
        async function saveEpisodeUrl(seasonNumber, episodeNumber) {
            const input = document.getElementById(`url_${seasonNumber}_${episodeNumber}`);
            const embedUrl = input.value.trim();
            
            if (!embedUrl) {
                alert('Please enter a video URL');
                return;
            }
            
            const btn = input.nextElementSibling;
            btn.disabled = true;
            btn.textContent = '⏳ Saving...';
            
            try {
                const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                
                // Try admin endpoint first
                let response = await fetch(`${API_BASE_URL}/api/admin/series/${currentSeriesId}/season/${seasonNumber}/episode/${episodeNumber}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        video: embedUrl,
                        'video.embedUrl': embedUrl
                    })
                });
                
                let data = await response.json();
                
                if (!data.status || data.status !== 'success') {
                    // Fallback
                    response = await fetch(`${API_BASE_URL}/api/luganda-movies/series/${currentSeriesId}/episode`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            seasonNumber,
                            episodeNumber,
                            embedUrl,
                            isTranslated: true
                        })
                    });
                    data = await response.json();
                }
                
                if (data.success || data.status === 'success') {
                    btn.textContent = '✅ Saved!';
                    setTimeout(() => { btn.textContent = '💾 Save'; btn.disabled = false; }, 2000);
                    
                    // Update local data
                    const seriesIndex = allSeries.findIndex(s => s._id === currentSeriesId);
                    if (seriesIndex !== -1 && data.data) {
                        allSeries[seriesIndex] = data.data;
                        currentSeries = data.data;
                    }
                } else {
                    throw new Error(data.message || 'Failed to save');
                }
            } catch (error) {
                console.error('Save error:', error);
                btn.textContent = '❌ Error';
                setTimeout(() => { btn.textContent = '💾 Save'; btn.disabled = false; }, 2000);
                alert(`Error: ${error.message}`);
            }
        }
        
        async function addSeason() {
            const seasonNum = (currentSeries.seasons?.length || 0) + 1;
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/series/${currentSeriesId}/season`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        seasonNumber: seasonNum,
                        name: `Season ${seasonNum}`,
                        episodes: []
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert(`✅ Season ${seasonNum} added!`);
                    allSeries = allSeries.map(s => s._id === currentSeriesId ? data.data : s);
                    currentSeries = data.data;
                    renderEpisodes(currentSeries);
                } else {
                    throw new Error(data.message || 'Failed to add season');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
        
        async function addEpisode(seasonNumber) {
            const season = currentSeries.seasons?.find(s => s.seasonNumber === seasonNumber);
            const episodeNum = (season?.episodes?.length || 0) + 1;
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/series/${currentSeriesId}/season/${seasonNumber}/episode`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        episodeNumber: episodeNum,
                        title: `Episode ${episodeNum}`,
                        duration: 45
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert(`✅ Episode ${episodeNum} added to Season ${seasonNumber}!`);
                    allSeries = allSeries.map(s => s._id === currentSeriesId ? data.data : s);
                    currentSeries = data.data;
                    renderEpisodes(currentSeries);
                } else {
                    throw new Error(data.message || 'Failed to add episode');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
        
        async function togglePublish(seriesId, currentStatus) {
            const newStatus = currentStatus === 'published' ? 'draft' : 'published';
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/series/${seriesId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert(`✅ Series ${newStatus === 'published' ? 'published' : 'unpublished'}!`);
                    loadSeries();
                } else {
                    throw new Error(data.message || 'Failed to update status');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
        
        async function deleteSeries(seriesId) {
            if (!confirm('⚠️ Are you sure you want to delete this series?\n\nThis will permanently remove all seasons and episodes. This action cannot be undone.')) {
                return;
            }
            
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/series/${seriesId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert('✅ Series deleted!');
                    loadSeries();
                } else {
                    throw new Error(data.message || 'Failed to delete');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }
        
        function openImportModal() {
            window.location.href = 'admin.html?action=import-series';
        }
        
        // Close modal on outside click
        document.getElementById('episodesModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEpisodesModal();
            }
        });
        
        // Escape key closes modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.getElementById('episodesModal').classList.contains('active')) {
                closeEpisodesModal();
            }
        });
    </script>
</body>
</html>
