<!DOCTYPE html>
<html lang="en">
<head>
    <title>Watch TV Series - Unruly Movies</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Watch Luganda translated TV series with all seasons and episodes on Unruly Movies.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4ade80">
    <meta name="robots" content="noindex">
    <!-- No outgoing Referer from this page — BunnyCDN's hotlink protection
         allows referrer-less requests (treats them as direct access) but
         blocks a cross-site Referer, which is exactly what the browser would
         otherwise send when this page's <video> fetches a b-cdn.net URL. -->
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="/assets/images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile-improvements.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4ade80;
            --background-dark: #0a0a0a;
            --background-light: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #333333;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background-dark);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }
        
        /* Header */
        .series-header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), var(--background-dark));
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .logo {
            height: 35px;
        }
        
        /* Main Layout */
        .series-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Hero Section */
        .series-hero {
            position: relative;
            height: 450px;
            margin: -20px -20px 0 -20px;
            overflow: hidden;
        }

        /* Custom control bar (raw <video> has no library — this replaces
           native browser controls, which look and behave inconsistently
           across browsers/devices, with one consistent branded bar). */
        .cc-center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 46;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s, background 0.15s, transform 0.15s;
        }
        .video-container:not(.cc-playing) .cc-center-play {
            opacity: 1;
            pointer-events: auto;
        }
        .cc-center-play:hover {
            background: rgba(74, 222, 128, 0.25);
            border-color: rgba(74, 222, 128, 0.6);
        }
        .cc-center-play svg { margin-left: 4px; }

        .cc-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 47;
            padding: 26px 12px 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.88) 70%);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .video-container:not(.cc-playing) .cc-bar,
        .video-container.cc-active .cc-bar {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .cc-progress {
            position: relative;
            height: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .cc-progress::before {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.25);
        }
        .cc-progress-buffered,
        .cc-progress-played {
            position: absolute;
            left: 0;
            height: 4px;
            border-radius: 2px;
            width: 0%;
        }
        .cc-progress-buffered { background: rgba(255,255,255,0.4); }
        .cc-progress-played { background: var(--primary-color, #4ade80); }
        .cc-progress-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color, #4ade80);
            box-shadow: 0 0 0 3px rgba(74,222,128,0.25);
            left: 0%;
            transform: translateX(-50%);
        }

        .cc-row {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .cc-btn {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 6px;
            opacity: 0.9;
            transition: opacity 0.15s, background 0.15s, color 0.15s;
        }
        .cc-btn:hover {
            opacity: 1;
            background: rgba(255,255,255,0.1);
            color: var(--primary-color, #4ade80);
        }
        .cc-btn.forward svg { transform: scaleX(-1); }
        .cc-btn .seek-label {
            font-size: 8px;
            font-weight: 700;
            line-height: 1;
        }

        .cc-time {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            font-variant-numeric: tabular-nums;
            margin-left: 6px;
            white-space: nowrap;
        }
        .cc-spacer { flex: 1; }
        
        .series-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
        }
        
        .series-hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px;
            background: linear-gradient(transparent, var(--background-dark));
        }
        
        .series-hero-content {
            display: flex;
            gap: 30px;
            align-items: flex-end;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .series-poster {
            width: 180px;
            height: 270px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        
        .series-info h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .series-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .series-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .series-rating {
            color: #ffd700 !important;
        }
        
        .series-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .genre-tag {
            background: rgba(74, 222, 128, 0.2);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: capitalize;
        }
        
        .series-overview {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.7;
            max-width: 700px;
        }

        .sp-eyebrow {
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sp-rating-badge {
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid var(--primary-color);
            color: var(--primary-color) !important;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 12px;
        }

        .sp-actions {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(76px, 1fr);
            gap: 10px;
            margin-bottom: 16px;
            max-width: 460px;
        }

        .sp-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 6px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .sp-action-btn:hover {
            border-color: var(--primary-color);
            background: rgba(74, 222, 128, 0.1);
        }

        .sp-action-btn.is-disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Request modal */
        .sp-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .sp-modal {
            background: var(--background-light);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 26px;
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .sp-modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
        }

        .sp-modal-close:hover {
            color: var(--text-primary);
        }

        .sp-modal h3 {
            color: var(--text-primary);
            margin: 0 0 6px;
            font-size: 19px;
        }

        .sp-modal-sub {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 0 0 18px;
        }

        .sp-modal label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .sp-modal input,
        .sp-modal textarea {
            width: 100%;
            margin-top: 6px;
            background: var(--background-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

        .sp-modal input:focus,
        .sp-modal textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .sp-modal-submit {
            width: 100%;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
        }

        .sp-modal-submit:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .sp-modal-status {
            text-align: center;
            font-size: 13px;
            margin: 10px 0 0;
            min-height: 16px;
            color: var(--text-secondary);
        }

        /* Video Player Section */
        .player-section {
            background: var(--background-light);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            max-width: 1500px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }
        
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-container:fullscreen,
        .video-container:-webkit-full-screen,
        .video-container:-ms-fullscreen {
            width: 100vw;
            height: 100vh;
            padding-top: 0;
            border-radius: 0;
        }

        .video-container:fullscreen iframe,
        .video-container:-webkit-full-screen iframe,
        .video-container:-ms-fullscreen iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        
        .no-video-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-secondary);
        }
        
        .no-video-message svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        /* Video Loading Overlay */
        .video-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #fff;
        }
        
        .video-loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(74, 222, 128, 0.3);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .video-loading-overlay p {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .now-playing-info {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .now-playing-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .now-playing-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Season Tabs */
        .season-tabs {
            display: flex;
            overflow-x: auto;
            gap: 5px;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid var(--border-color);
        }
        
        .season-tab {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .season-tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .season-tab.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #000;
            font-weight: 600;
        }
        
        /* Episodes List */
        .episodes-container {
            padding: 20px;
        }
        
        .episodes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .episodes-header h3 {
            font-size: 18px;
        }
        
        .episode-count {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .episodes-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .episode-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
            border: 2px solid transparent;
            background: var(--background-dark);
        }

        .episode-card:hover {
            border-color: var(--primary-color);
            background: rgba(74, 222, 128, 0.05);
        }

        .episode-card.active {
            border-color: var(--primary-color);
            background: rgba(74, 222, 128, 0.1);
        }

        .episode-card.unavailable {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .episode-card.unavailable:hover {
            border-color: transparent;
            background: var(--background-dark);
        }

        .episode-thumb-wrap {
            position: relative;
            flex-shrink: 0;
            width: 160px;
            border-radius: 8px;
            overflow: hidden;
        }

        .episode-thumb-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, transparent 55%);
        }

        .episode-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            display: block;
            background: #333;
        }

        .episode-num-badge {
            position: absolute;
            left: 8px;
            bottom: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.75);
            border: 1.5px solid var(--primary-color);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .episode-lock-badge {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.75);
            color: #ff6b6b;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            font-size: 11px;
        }

        .episode-info {
            flex: 1;
            min-width: 0;
        }

        .episode-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .episode-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .episode-overview {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error State */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .error-state h2 {
            margin-bottom: 10px;
        }
        
        .error-state p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-color);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
        }
        
        /* Cast Section */
        .cast-section {
            margin-top: 30px;
        }
        
        .cast-section h3 {
            font-size: 20px;
            margin-bottom: 20px;
        }
        
        .cast-grid {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .cast-card {
            text-align: center;
            flex-shrink: 0;
        }
        
        .cast-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            background: #333;
        }
        
        .cast-card .name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
        }
        
        .cast-card .character {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .series-container {
                padding: 14px;
            }

            .series-hero {
                height: 350px;
            }

            .player-section {
                border-radius: 14px;
                box-shadow: none;
            }
            
            .series-hero-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .series-poster {
                width: 140px;
                height: 210px;
            }
            
            .series-info h1 {
                font-size: 24px;
            }
            
            .series-meta {
                justify-content: center;
            }
            
            .series-genres {
                justify-content: center;
            }

            .sp-actions {
                grid-auto-columns: minmax(64px, 1fr);
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
            }

            .episode-card {
                gap: 10px;
                padding: 8px;
            }

            .episode-thumb-wrap {
                width: 110px;
            }

            .episode-title {
                font-size: 13px;
            }

            .episode-overview {
                -webkit-line-clamp: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="series-header">
        <button class="back-btn" onclick="history.back()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back
        </button>
        <a href="index.html">
            <img src="assets/images/logo-wordmark.png" alt="Unruly Movies" class="logo">
        </a>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading series...</p>
        </div>
    </main>

    <!-- Request modal -->
    <div class="sp-modal-overlay" id="spRequestOverlay" onclick="if (event.target === this) closeSeriesRequestModal();">
        <div class="sp-modal">
            <button class="sp-modal-close" onclick="closeSeriesRequestModal()" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h3>Request this Series</h3>
            <p class="sp-modal-sub">Missing episodes, wrong VJ, or something else — let us know.</p>
            <form id="spRequestForm" onsubmit="submitSeriesRequest(event)">
                <label>Name
                    <input type="text" id="spReqName" required>
                </label>
                <label>Email
                    <input type="email" id="spReqEmail" required>
                </label>
                <label>Message
                    <textarea id="spReqMessage" rows="4" required></textarea>
                </label>
                <button type="submit" class="sp-modal-submit">Send Request</button>
            </form>
            <p class="sp-modal-status" id="spRequestStatus"></p>
        </div>
    </div>

    <script src="js/config.js?v=20260124"></script>
    <script src="js/pesapal-checkout.js"></script>

    <script>
        // API Configuration - always use production API in production
        const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
        const API_BASE_URL = isProduction 
            ? 'https://luganda-translated-movies-production.up.railway.app'
            : ((window.API_CONFIG && window.API_CONFIG.BASE_URL) || 'http://localhost:5000');

        function getAuthToken() {
            return (
                localStorage.getItem('token') ||
                localStorage.getItem('authToken') ||
                sessionStorage.getItem('token') ||
                sessionStorage.getItem('authToken')
            );
        }

        function normalizeBearerToken(token) {
            if (typeof token !== 'string') return '';
            const trimmed = token.trim();
            return trimmed.toLowerCase().startsWith('bearer ')
                ? trimmed.slice(7).trim()
                : trimmed;
        }

        function redirectToLogin() {
            const currentUrl = window.location.href;
            localStorage.setItem('redirectAfterLogin', currentUrl);
            window.location.replace('login.html?redirect=' + encodeURIComponent(currentUrl));
        }

        function isBot() {
            const ua = navigator.userAgent || '';
            return /Googlebot|bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|ia_archiver|AhrefsBot|SemrushBot|MJ12bot|DotBot|Applebot|Twitterbot|LinkedInBot|WhatsApp|Slack|Discordbot/i.test(ua);
        }

        async function requireLoggedInMember() {
            const token = normalizeBearerToken(getAuthToken());
            if (!token) { redirectToLogin(); return false; }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/check-access`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('authToken');
                    redirectToLogin();
                    return false;
                }

                if (!response.ok) return true;

                const data = await response.json();
                if (!data.success) { redirectToLogin(); return false; }

                window._seriesAccess = data.access;

                // Free plan — let the page load, gate at play time
                if (data.access && data.access.freeUser) {
                    return true; // allow loadSeries() so episode list is visible
                }

                return true;
            } catch (error) {
                return true;
            }
        }
        
        // Get series ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const seriesId = urlParams.get('id');
        const requestedSeason = parseInt(urlParams.get('season') || '1', 10);
        const requestedEpisode = parseInt(urlParams.get('episode') || '0', 10);
        
        let seriesData = null;
        let currentSeason = Number.isFinite(requestedSeason) && requestedSeason > 0 ? requestedSeason : 1;
        let currentEpisode = (Number.isFinite(requestedEpisode) && requestedEpisode > 0)
            ? { season: currentSeason, episode: requestedEpisode }
            : null;
        let seriesFullscreenRotation = false;

        const FULLSCREEN_ENTER_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3" />
            <path d="M16 3h3a2 2 0 0 1 2 2v3" />
            <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
            <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        </svg>`;
        const FULLSCREEN_EXIT_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3v3a2 2 0 0 1-2 2H4" />
            <path d="M15 3v3a2 2 0 0 0 2 2h3" />
            <path d="M9 21v-3a2 2 0 0 0-2-2H4" />
            <path d="M15 21v-3a2 2 0 0 1 2-2h3" />
        </svg>`;
        const CC_PLAY_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`;
        const CC_PAUSE_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>`;
        const CC_CENTER_PLAY_ICON = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`;
        const CC_SEEK_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a8 8 0 1 1-8 8"></path><polyline points="12 1 12 4 9 4"></polyline></svg><span class="seek-label">10</span>`;
        const CC_VOLUME_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9" fill="currentColor" stroke="none"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18 6a9 9 0 0 1 0 12"></path></svg>`;
        const CC_MUTED_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 7 9 12 4 12 20 7 15 3 15 3 9" fill="currentColor" stroke="none"></polygon><line x1="16" y1="9" x2="22" y2="15"></line><line x1="22" y1="9" x2="16" y2="15"></line></svg>`;

        let seriesControlsHideTimer = null;
        function markSeriesControlsActive() {
            const container = document.getElementById('video-container');
            if (!container) return;
            container.classList.add('cc-active');
            clearTimeout(seriesControlsHideTimer);
            seriesControlsHideTimer = setTimeout(() => container.classList.remove('cc-active'), 2800);
        }

        function toggleSeriesPlay() {
            const video = document.getElementById('series-video');
            if (!video) return;
            if (video.paused) video.play().catch(() => {});
            else video.pause();
            markSeriesControlsActive();
        }

        function updateSeriesPlayState(isPlaying) {
            const container = document.getElementById('video-container');
            if (container) container.classList.toggle('cc-playing', isPlaying);
            const btn = document.getElementById('ccPlayBtn');
            if (btn) btn.innerHTML = isPlaying ? CC_PAUSE_ICON : CC_PLAY_ICON;
        }

        function formatSeriesTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const mm = h > 0 ? String(m).padStart(2, '0') : String(m);
            const ss = String(s).padStart(2, '0');
            return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        }

        function updateSeriesProgress() {
            const video = document.getElementById('series-video');
            if (!video || !isFinite(video.duration) || video.duration <= 0) return;
            const pct = Math.min(100, Math.max(0, (video.currentTime / video.duration) * 100));
            const played = document.getElementById('ccPlayed');
            const handle = document.getElementById('ccHandle');
            if (played) played.style.width = pct + '%';
            if (handle) handle.style.left = pct + '%';
            const timeEl = document.getElementById('ccTime');
            if (timeEl) timeEl.textContent = `${formatSeriesTime(video.currentTime)} / ${formatSeriesTime(video.duration)}`;
        }

        function updateSeriesBuffered() {
            const video = document.getElementById('series-video');
            if (!video || !video.buffered || video.buffered.length === 0 || !isFinite(video.duration) || video.duration <= 0) return;
            try {
                const end = video.buffered.end(video.buffered.length - 1);
                const pct = Math.min(100, Math.max(0, (end / video.duration) * 100));
                const buffered = document.getElementById('ccBuffered');
                if (buffered) buffered.style.width = pct + '%';
            } catch (e) {}
        }

        let seriesProgressDragging = false;
        function seekFromClientX(clientX) {
            const video = document.getElementById('series-video');
            const bar = document.getElementById('ccProgress');
            if (!video || !bar || !isFinite(video.duration) || video.duration <= 0) return;
            const rect = bar.getBoundingClientRect();
            const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
            video.currentTime = pct * video.duration;
            updateSeriesProgress();
        }

        function seekFromProgressClick(event) {
            seekFromClientX(event.clientX);
            markSeriesControlsActive();
        }

        function startProgressDrag(event) {
            event.preventDefault();
            seriesProgressDragging = true;
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            seekFromClientX(clientX);
            markSeriesControlsActive();

            function onMove(e) {
                if (!seriesProgressDragging) return;
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                seekFromClientX(cx);
            }
            function onUp() {
                seriesProgressDragging = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onUp);
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onUp);
        }

        function toggleSeriesMute() {
            const video = document.getElementById('series-video');
            if (!video) return;
            video.muted = !video.muted;
            const btn = document.getElementById('ccMuteBtn');
            if (btn) btn.innerHTML = video.muted ? CC_MUTED_ICON : CC_VOLUME_ICON;
            markSeriesControlsActive();
        }

        function updateFullscreenIcon(isFullscreen) {
            const btn = document.getElementById('embedFullscreenBtn');
            if (!btn) return;
            btn.innerHTML = isFullscreen ? FULLSCREEN_EXIT_ICON : FULLSCREEN_ENTER_ICON;
            btn.setAttribute('aria-label', isFullscreen ? 'Exit fullscreen' : 'Fullscreen');
        }

        function toggleVideoContainerFullscreen(event) {
            if (event) event.preventDefault();
            const container = document.querySelector('.video-container');
            const video = document.getElementById('series-video');
            if (!container) return;

            const fsElement = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (fsElement) {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exit) exit.call(document);
                return;
            }

            const req = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
            if (req) {
                req.call(container);
            } else if (video && video.webkitEnterFullscreen) {
                // iOS Safari: arbitrary containers can't go fullscreen, only <video> elements can.
                video.webkitEnterFullscreen();
            }
        }

        function seekSeriesVideo(deltaSeconds) {
            const video = document.getElementById('series-video');
            if (!video || !isFinite(video.duration)) return;
            video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + deltaSeconds));
        }

        function isMobileSeriesViewport() {
            return window.matchMedia('(max-width: 920px)').matches;
        }

        async function lockSeriesLandscape() {
            if (!isMobileSeriesViewport()) return;

            try {
                if (screen.orientation?.lock) {
                    await screen.orientation.lock('landscape');
                    seriesFullscreenRotation = true;
                } else if (screen.lockOrientation) {
                    screen.lockOrientation('landscape');
                    seriesFullscreenRotation = true;
                }
            } catch (error) {
                seriesFullscreenRotation = false;
                console.log('Series orientation lock skipped:', error.message);
            }
        }

        function unlockSeriesLandscape() {
            if (!seriesFullscreenRotation) return;

            try {
                if (screen.orientation?.unlock) {
                    screen.orientation.unlock();
                } else if (screen.unlockOrientation) {
                    screen.unlockOrientation();
                }
            } catch (error) {
                console.log('Series orientation unlock skipped:', error.message);
            }

            seriesFullscreenRotation = false;
        }

        function handleSeriesFullscreenChange() {
            const isFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            document.body.classList.toggle('fullscreen-active', isFullscreen);
            updateFullscreenIcon(isFullscreen);

            if (isFullscreen) {
                lockSeriesLandscape();
            } else {
                unlockSeriesLandscape();
            }
        }
        document.addEventListener('fullscreenchange', handleSeriesFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleSeriesFullscreenChange);
        document.addEventListener('msfullscreenchange', handleSeriesFullscreenChange);
        
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Bots/crawlers: skip auth gate so Google indexes the content
            if (isBot()) {
                if (seriesId) loadSeries();
                return;
            }
            const isAuthorized = await requireLoggedInMember();
            if (!isAuthorized) return;

            if (!seriesId) {
                showError('No series ID provided');
                return;
            }
            loadSeries();
        });
        
        async function loadSeries() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/series/${seriesId}`);
                const data = await response.json();
                
                if (!data.success || !data.data) {
                    showError('Series not found');
                    return;
                }
                
                seriesData = data.data;
                
                // Update page title
                document.title = `${seriesData.originalTitle} - Unruly Movies`;
                
                renderSeries();
            } catch (error) {
                console.error('Error loading series:', error);
                showError('Failed to load series');
            }
        }
        
        function renderSeries() {
            const container = document.getElementById('main-content');
            
            // Get current season data
            const seasonData = seriesData.seasons?.find(s => s.seasonNumber === currentSeason) || seriesData.seasons?.[0];
            if (seasonData?.seasonNumber && seasonData.seasonNumber !== currentSeason) {
                currentSeason = seasonData.seasonNumber;
                if (currentEpisode) {
                    currentEpisode.season = currentSeason;
                }
            }
            
            // Find first available episode
            if (!currentEpisode && seasonData?.episodes?.length > 0) {
                const availableEpisode = seasonData.episodes.find(ep => ep.video?.hasVideo);
                if (availableEpisode) {
                    currentEpisode = {
                        season: currentSeason,
                        episode: availableEpisode.episodeNumber
                    };
                }
            }
            
            // Get current episode data
            const currentEp = currentEpisode 
                ? seriesData.seasons?.find(s => s.seasonNumber === currentEpisode.season)
                    ?.episodes?.find(e => e.episodeNumber === currentEpisode.episode)
                : null;
            
            container.innerHTML = `
                <!-- Hero Section -->
                <section class="series-hero">
                    <img src="${seriesData.backdrop || seriesData.poster || '/assets/images/placeholder.svg'}" 
                         alt="${seriesData.originalTitle}" class="series-backdrop"
                         onerror="this.src='/assets/images/placeholder.svg'">
                    <div class="series-hero-overlay">
                        <div class="series-hero-content">
                            <img src="${seriesData.poster || '/assets/images/placeholder.svg'}" 
                                 alt="${seriesData.originalTitle}" class="series-poster"
                                 onerror="this.src='/assets/images/placeholder.svg'">
                            <div class="series-info">
                                <div class="sp-eyebrow">Series</div>
                                <h1>${seriesData.lugandaTitle || seriesData.originalTitle}</h1>
                                ${seriesData.lugandaTitle && seriesData.lugandaTitle !== seriesData.originalTitle
                                    ? `<p style="color: var(--text-secondary); margin-bottom: 10px;">${seriesData.originalTitle}</p>`
                                    : ''}
                                <div class="series-meta">
                                    <span class="sp-rating-badge">★ ${(seriesData.rating?.imdb || 0).toFixed(1)}</span>
                                    <span>📅 ${seriesData.year || 'Unknown'}</span>
                                    <span>📺 ${seriesData.totalSeasons || 0} Season${seriesData.totalSeasons !== 1 ? 's' : ''}</span>
                                    <span>🎬 ${seriesData.totalEpisodes || 0} Episodes</span>
                                    ${seriesData.vjName ? `<span>🎙️ VJ ${seriesData.vjName}</span>` : ''}
                                </div>
                                <div class="series-genres">
                                    ${(seriesData.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('')}
                                </div>
                                <div class="sp-actions">
                                    <a class="sp-action-btn ${seriesData.trailer ? '' : 'is-disabled'}" ${seriesData.trailer ? `href="${seriesData.trailer}" target="_blank" rel="noopener"` : 'href="javascript:void(0)"'}>
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                            <path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"></path>
                                        </svg>
                                        <span>Trailer</span>
                                    </a>
                                    <button class="sp-action-btn" onclick="addToWatchlistSeries()">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                                        </svg>
                                        <span>My List</span>
                                    </button>
                                    <button class="sp-action-btn" onclick="handleSeriesDownload()">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                            <polyline points="7 10 12 15 17 10"></polyline>
                                            <line x1="12" y1="15" x2="12" y2="3"></line>
                                        </svg>
                                        <span>Download</span>
                                    </button>
                                    <button class="sp-action-btn" onclick="openSeriesRequestModal()">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="22" y1="2" x2="11" y2="13"></line>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                        </svg>
                                        <span>Request</span>
                                    </button>
                                </div>
                                <p class="series-overview">${seriesData.description || 'No description available.'}</p>
                            </div>
                        </div>
                    </div>
                </section>
                
                <div class="series-container">
                    <!-- Player Section -->
                    <section class="player-section">
                        <div class="video-container" id="video-container" onmousemove="markSeriesControlsActive()" onclick="markSeriesControlsActive()" ontouchstart="markSeriesControlsActive()">
                            ${(() => {
                                const isFreeEpisode = currentEpisode && Number(currentEpisode.season) === 1 && Number(currentEpisode.episode) === 1;
                                if (window._seriesAccess && window._seriesAccess.freeUser && !isFreeEpisode) {
                                    return `<div style="position:absolute;inset:0;width:100%;height:100%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;" onclick="showSubscribePlans()">
                                        <div style="width:76px;height:76px;border-radius:50%;background:rgba(74,222,128,0.92);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(74,222,128,0.18);">
                                            <svg width="30" height="30" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                        </div>
                                        <span style="color:#fff;font-size:13px;background:rgba(0,0,0,0.65);padding:5px 16px;border-radius:20px;">Subscribe to watch</span>
                                    </div>`;
                                }
                                if (!currentEp?.video?.hasVideo) {
                                    return `<div class="no-video-message">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                        </svg>
                                        <h3>Select an Episode</h3>
                                        <p>Choose an episode from the list below to start watching</p>
                                    </div>`;
                                }
                                // Real URL isn't in the page — resolved after render via
                                // loadCurrentEpisodeVideo(), the same authenticated,
                                // entitlement-checked flow movies use.
                                return `
                                    <div class="video-loading-overlay" id="video-loading">
                                        <div class="spinner"></div>
                                        <p>Loading video...</p>
                                    </div>
                                    <video id="series-video" controlslist="nodownload noplaybackrate" disablepictureinpicture
                                           autoplay preload="auto" playsinline
                                           style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000;"
                                           oncontextmenu="return false"
                                           onclick="toggleSeriesPlay()"
                                           onplay="updateSeriesPlayState(true)"
                                           onpause="updateSeriesPlayState(false)"
                                           onended="updateSeriesPlayState(false)"
                                           ontimeupdate="updateSeriesProgress()"
                                           onprogress="updateSeriesBuffered()"
                                           onloadedmetadata="updateSeriesProgress()"
                                           onwebkitbeginfullscreen="updateFullscreenIcon(true)"
                                           onwebkitendfullscreen="updateFullscreenIcon(false)"
                                           oncanplay="hideVideoLoading()">
                                    </video>

                                    <button class="cc-center-play" id="ccCenterPlay" type="button" aria-label="Play" onclick="toggleSeriesPlay()">${CC_CENTER_PLAY_ICON}</button>

                                    <div class="cc-bar" id="ccBar">
                                        <div class="cc-progress" id="ccProgress" onclick="seekFromProgressClick(event)" onmousedown="startProgressDrag(event)" ontouchstart="startProgressDrag(event)">
                                            <div class="cc-progress-buffered" id="ccBuffered"></div>
                                            <div class="cc-progress-played" id="ccPlayed"></div>
                                            <div class="cc-progress-handle" id="ccHandle"></div>
                                        </div>
                                        <div class="cc-row">
                                            <button class="cc-btn" id="ccPlayBtn" type="button" aria-label="Play/Pause" onclick="toggleSeriesPlay()">${CC_PLAY_ICON}</button>
                                            <button class="cc-btn" type="button" aria-label="Rewind 10 seconds" onclick="seekSeriesVideo(-10)">${CC_SEEK_ICON}</button>
                                            <button class="cc-btn forward" type="button" aria-label="Forward 10 seconds" onclick="seekSeriesVideo(10)">${CC_SEEK_ICON}</button>
                                            <button class="cc-btn" id="ccMuteBtn" type="button" aria-label="Mute" onclick="toggleSeriesMute()">${CC_VOLUME_ICON}</button>
                                            <span class="cc-time" id="ccTime">0:00 / 0:00</span>
                                            <div class="cc-spacer"></div>
                                            <button class="cc-btn" id="embedFullscreenBtn" type="button" aria-label="Fullscreen" onclick="toggleVideoContainerFullscreen(event)">${FULLSCREEN_ENTER_ICON}</button>
                                        </div>
                                    </div>
                                `;
                            })()}
                        </div>
                        ${currentEp ? `
                        <div class="now-playing-info" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
                            <div>
                                <h3>S${currentEpisode.season} E${currentEpisode.episode}: ${currentEp.name || 'Episode ' + currentEpisode.episode}</h3>
                                <p>${currentEp.overview || 'No description available.'}</p>
                            </div>
                            <button onclick="handleSeriesDownload()" style="flex-shrink:0;padding:8px 16px;background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.3);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Download
                            </button>
                        </div>
                        ` : ''}
                        
                        <!-- Season Tabs -->
                        <div class="season-tabs">
                            ${(seriesData.seasons || []).map(season => `
                                <button class="season-tab ${season.seasonNumber === currentSeason ? 'active' : ''}" 
                                        onclick="switchSeason(${season.seasonNumber})">
                                    Season ${season.seasonNumber}
                                </button>

        // Real episode URL isn't in the page — resolve it via the same

        async function loadCurrentEpisodeVideo() {
            const videoEl = document.getElementById('series-video');
            if (!videoEl || !currentEpisode) return;

            const seasonData = seriesData.seasons?.find(s => s.seasonNumber === currentEpisode.season);
            const ep = seasonData?.episodes?.find(e => e.episodeNumber === currentEpisode.episode);
            if (!ep?.video?.hasVideo) return;

            try {
                const authToken = normalizeBearerToken(getAuthToken());
                const tokenResp = await fetch(`${API_BASE_URL}/api/video/playback-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ movieId: seriesData._id, season: currentEpisode.season, episode: currentEpisode.episode })
                });
                const tokenData = await tokenResp.json();
                if (!tokenData.success || !tokenData.token) {
                    showVideoLoadError(tokenData.message || 'Unable to start playback');
                    return;
                }

                const resolveResp = await fetch(`${API_BASE_URL}/api/video/resolve/luganda/${seriesData._id}?season=${currentEpisode.season}&episode=${currentEpisode.episode}&token=${encodeURIComponent(tokenData.token)}`);
                const resolveData = await resolveResp.json();
                if (!resolveData.success || !resolveData.directUrl) {
                    showVideoLoadError(resolveData.message || 'This video is currently unavailable.');
                    return;
                }

                // Every source plays directly from origin first, regardless
                // of host or container (.mkv included) — this page sends no
                // Referer (see the <meta name="referrer"> tag above), which
                // is what actually let BunnyCDN's hotlink protection
                // through. handleVideoError below is the only thing that
                // still reaches for the proxy, and only for whichever
                // specific source turns out to need it.
                seriesNetworkRetries = 0; // fresh source — don't inherit a previous episode's exhausted retry count
                videoEl.onerror = () => handleVideoError(videoEl, resolveData.directUrl, false);
                videoEl.src = resolveData.directUrl;
                videoEl.load();
            } catch (e) {
                console.error('Episode resolve error:', e);
                showVideoLoadError('Failed to load video. Please try again.');
            }
        }

        function hideVideoLoading() {

        let seriesNetworkRetries = 0;
        const MAX_SERIES_NETWORK_RETRIES = 3;

        function handleVideoError(videoElement, originalUrl, alreadyProxied) {
            const errCode = videoElement.error?.code;
            console.error('Video error:', videoElement.error);

            // First failure on a direct (non-proxied) source: retry once
            // through the backend proxy before giving up — covers any CDN
            // whose direct fetch fails for a reason other than the
            // BunnyCDN Referer case (e.g. CORS on a source we didn't expect).
            if (!alreadyProxied) {
                console.warn('Retrying playback via stream proxy after direct-source error');
                const proxyUrl = `${API_BASE_URL}/api/video/stream-proxy?url=${encodeURIComponent(originalUrl)}`;
                videoElement.onerror = () => handleVideoError(videoElement, originalUrl, true);
                videoElement.src = proxyUrl;
                videoElement.load();
                return;
            }

            // CODE 2 (network) / CODE 3 (decode — often the same root cause,
            // a truncated stream from a dropped connection). Reload the same
            // source and resume from where playback was, with a short
            // backoff, before falling back to the manual-retry UI below —
            // a browser's own video/download handling would recover from a
            // dropped connection silently rather than dead-end on one blip.
            if ((errCode === 2 || errCode === 3) && seriesNetworkRetries < MAX_SERIES_NETWORK_RETRIES) {
                seriesNetworkRetries++;
                const resumeAt = videoElement.currentTime || 0;
                // currentSrc, not originalUrl — originalUrl is always the raw
                // pre-proxy URL here (it's only carried along as a flag-ish
                // param so the first-failure branch above knows what to
                // proxy), while currentSrc is whatever's actually loaded
                // right now, proxied or not.
                const retrySrc = videoElement.currentSrc || originalUrl;
                console.warn(`Network error (code ${errCode}) — retry ${seriesNetworkRetries}/${MAX_SERIES_NETWORK_RETRIES}, resuming at ${resumeAt}s`);
                setTimeout(() => {
                    videoElement.onerror = () => handleVideoError(videoElement, originalUrl, true);
                    videoElement.src = retrySrc;
                    videoElement.load();
                    videoElement.addEventListener('loadedmetadata', () => {
                        if (resumeAt > 0) videoElement.currentTime = resumeAt;
                        videoElement.play().catch(() => {});
                    }, { once: true });
                }, seriesNetworkRetries * 1000);
                return;
            }

            const loading = document.getElementById('video-loading');
            if (loading) {
                loading.innerHTML = `
                    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" style="margin-bottom: 15px;">
                        <circle cx="12" cy="12" r="10"></circle>

                    <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 15px;">
                        The server may be processing the file. Try again in a moment.
                    </p>

                        Retry
                    </button>
                `;
            }
        }

            try {
                const authToken = normalizeBearerToken(getAuthToken());
                const res = await fetch(`${API_BASE_URL}/api/requests`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(authToken ? { Authorization: `Bearer ${authToken}` } : {})

            const token = localStorage.getItem('token') || localStorage.getItem('authToken') || '';
            if (!token) { window.location.href = 'login.html'; return; }
            const btn = document.querySelector(`[data-series-plan="${plan}"]`);
            const origText = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = 'Processing...'; }

            // Open synchronously, inside the click gesture, so it isn't popup-blocked.
            const popup = window.PesapalCheckout?.openBlankPopup();

            try {
                const r = await fetch(`${API_BASE_URL}/api/payments/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ plan, paymentMethod: 'pesapal' })
                });
                const d = await r.json();
                if (d.status === 'success' && d.data && d.data.redirectUrl) {
                    document.getElementById('downloadPrompt')?.remove();

                    if (window.PesapalCheckout && popup) {
                        window.PesapalCheckout.runCheckout(popup, d.data.redirectUrl, {
                            ref: d.data.merchantReference,
                            token,
                            apiBase: API_BASE_URL,
                            onSuccess: () => {
                                window.dispatchEvent(new CustomEvent('pesapal-payment-success', { detail: { plan } }));
                                window.location.reload();
                            },
                            onFailure: (status) => {
                                if (status === 'cancelled') return;
                                alert(status === 'timeout'
                                    ? 'Still waiting on confirmation — check back in a moment.'
                                    : 'Payment failed. Please try again.');
                            }
                        });
                    } else {
                        // Popup blocked or helper unavailable — fall back to same-tab redirect.
                        window.location.href = d.data.redirectUrl;
                    }
                } else {
                    if (popup && !popup.closed) popup.close();
                    alert(d.message || d.error || 'Payment error. Please try again.');
                    if (btn) { btn.disabled = false; btn.textContent = origText; }
                }
            } catch (e) {
                if (popup && !popup.closed) popup.close();
                alert('Network error. Please try again.');
                if (btn) { btn.disabled = false; btn.textContent = origText; }
            }
        }

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) ||

        async function downloadEpisode() {
            if (!currentEpisode) return;
            const seasonData = seriesData.seasons?.find(s => s.seasonNumber === currentSeason);
            const ep = seasonData?.episodes?.find(e => e.episodeNumber === currentEpisode?.episode);
            if (!ep?.video?.hasVideo) return;

            // forDownload:true forces the real paid-plan check server-side even
            // for the free S1E1 preview episode.
            const authToken = normalizeBearerToken(getAuthToken());
            const tokenResp = await fetch(`${API_BASE_URL}/api/video/playback-token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                body: JSON.stringify({ movieId: seriesData._id, season: currentEpisode.season, episode: currentEpisode.episode, forDownload: true })
            });
            const tokenData = await tokenResp.json();
            if (!tokenData.success || !tokenData.token) {
                showNotificationToast(tokenData.message || 'Unable to start download');
                return;
            }

            const resolveResp = await fetch(`${API_BASE_URL}/api/video/resolve/luganda/${seriesData._id}?season=${currentEpisode.season}&episode=${currentEpisode.episode}&token=${encodeURIComponent(tokenData.token)}`);
            const resolveData = await resolveResp.json();
            if (!resolveData.success || !resolveData.directUrl) {
                showNotificationToast(resolveData.message || 'Download unavailable for this episode');
                return;
            }

            const url = resolveData.directUrl;
            const title = `${seriesData.originalTitle || 'Series'} S${currentEpisode.season}E${currentEpisode.episode}`;
            const fileName = `${title.replace(/[^a-zA-Z0-9 _-]/g, '').trim()}.mp4`;
            // Always route through the backend proxy — never hand out the raw
            // CDN URL. This also gets Content-Disposition: attachment so
            // Chrome saves instead of just playing the video, and shows up
            // as a real download in the browser's native download UI.
            const proxyDownload = `${API_BASE_URL}/api/video/stream-proxy?url=${encodeURIComponent(url)}&download=${encodeURIComponent(fileName)}`;

            if (isIOS()) {
                showIOSDownloadInstructions(proxyDownload);
                return;
            }

            const link = document.createElement('a');
            link.href = proxyDownload;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showNotificationToast('Download started!');
        }

                    <h3 style="color:#fff;font-size:18px;margin:0 0 10px;">Saving on iPhone/iPad</h3>
                    <p style="color:#999;font-size:14px;line-height:1.6;margin:0 0 20px;">Safari can't auto-download videos. Tap <strong style="color:#fff">Open Video</strong>, then tap and hold and choose <strong style="color:#fff">"Download Video"</strong>, or use the Share button.</p>
                    <a href="${url}" target="_blank" style="display:block;background:#4ade80;color:#000;font-weight:700;padding:13px;border-radius:12px;text-decoration:none;font-size:15px;margin-bottom:10px;">Open Video</a>
                    <button onclick="document.getElementById('iosDownloadPrompt').remove()" style="background:none;border:none;color:#666;font-size:13px;cursor:pointer;padding:8px;">Cancel</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

    </script>
    
    <!-- Back Button Handler - Prevent app close on Android -->
    <script>
        (function() {
            // Push a state so back button doesn't close the app
            if (window.history.length <= 2) {
                window.history.pushState({ seriesPlayerPage: true }, '', window.location.href);
            }
            
            // Handle back button - go to series page instead of closing
            window.addEventListener('popstate', function(event) {
                window.location.href = '/series.html';
            });
        })();
    </script>
