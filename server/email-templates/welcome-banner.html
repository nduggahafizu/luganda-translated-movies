<!DOCTYPE html>
<!--
  Source design for the welcome email banner (assets/images/email/welcome-banner.jpg).
  It is rendered once to a JPEG with headless Chrome at 1200x520 — edit this
  file and re-render to change the banner. Posters are real TMDB artwork from
  the catalogue; the logo is the site's own wordmark.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 520px; background: #09090f; overflow: hidden; font-family: 'Inter', Arial, sans-serif; }
  .stage { position: relative; width: 1200px; height: 520px; overflow: hidden;
           background: radial-gradient(900px 520px at 85% 50%, rgba(74,222,128,0.16), transparent 70%), #09090f; }

  /* Tilted poster wall on the right */
  .wall { position: absolute; top: -140px; right: -120px; width: 820px; height: 820px;
          transform: rotate(-12deg); display: grid; grid-template-columns: repeat(4, 180px); gap: 18px; }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .col:nth-child(2) { margin-top: 90px; }
  .col:nth-child(4) { margin-top: 60px; }
  .col img { width: 180px; height: 270px; object-fit: cover; border-radius: 14px;
             box-shadow: 0 18px 40px rgba(0,0,0,0.6); }

  /* Fade the wall into the dark left side so text stays readable */
  .fade { position: absolute; inset: 0;
          background: linear-gradient(90deg, #09090f 0%, #09090f 38%, rgba(9,9,15,0.85) 52%, rgba(9,9,15,0.2) 78%, rgba(9,9,15,0.35) 100%); }

  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px;
          display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 330px; margin-bottom: 34px; }
  .eyebrow { display: inline-block; align-self: flex-start; background: rgba(74,222,128,0.14);
             color: #4ade80; border: 1px solid rgba(74,222,128,0.4); border-radius: 999px;
             font-size: 17px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
             padding: 8px 18px; margin-bottom: 22px; }
  h1 { color: #fff; font-size: 62px; line-height: 1.02; font-weight: 900; letter-spacing: -1.5px; margin-bottom: 20px; }
  h1 span { color: #4ade80; }
  p { color: rgba(255,255,255,0.72); font-size: 23px; line-height: 1.45; font-weight: 500; }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
         background: linear-gradient(90deg, #22c55e, #4ade80 40%, rgba(74,222,128,0) 100%); }
</style>
</head>
<body>
  <div class="stage">
    <div class="wall">
      <div class="col">
        <img src="https://image.tmdb.org/t/p/w342/fYXqpgPmHMphSF2W30GbTeJVIa5.jpg">
        <img src="https://image.tmdb.org/t/p/w342/z8pfWCk6SlxxDLXXQdUHdxF5dwJ.jpg">
        <img src="https://image.tmdb.org/t/p/w342/gPxlb7LLqbsKgjltgVrgYdhfxCZ.jpg">
      </div>
      <div class="col">
        <img src="https://image.tmdb.org/t/p/w342/jt8pfSIdi47YpFMMWVRr8w5u2S0.jpg">
        <img src="https://image.tmdb.org/t/p/w342/flMnawvBtLvMStfeAjuBE1K9ykX.jpg">
        <img src="https://image.tmdb.org/t/p/w342/AlfndBQucnWC7igEIG2L0sk6tiF.jpg">
      </div>
      <div class="col">
        <img src="https://image.tmdb.org/t/p/w342/niQ4NBh2jqAf1hDZP5m6ReWFAb7.jpg">
        <img src="https://image.tmdb.org/t/p/w342/bAbBNVplg7h79sm94OyHeKk8Phz.jpg">
        <img src="https://image.tmdb.org/t/p/w342/ooC6al3vhhECG998ZivkAZUdgst.jpg">
      </div>
      <div class="col">
        <img src="https://image.tmdb.org/t/p/w342/z4gVnxTaks3anTycwKjDmvQSuWt.jpg">
        <img src="https://image.tmdb.org/t/p/w342/j3rUkHIAAoKr6jU30q3Db4fcIF9.jpg">
        <img src="https://image.tmdb.org/t/p/w342/fYXqpgPmHMphSF2W30GbTeJVIa5.jpg">
      </div>
    </div>
    <div class="fade"></div>
    <div class="copy">
      <img class="logo" src="http://localhost:5000/assets/images/logo-wordmark.png" alt="Unruly Movies">
      <span class="eyebrow">Welcome aboard</span>
      <h1>Movies you love,<br><span>in Luganda.</span></h1>
      <p>Translated by Uganda's favourite VJs — ready to stream on your phone, laptop or TV.</p>
    </div>
    <div class="bar"></div>
  </div>
</body>
</html>
